# تاکورا — استقرار روی یک VPS ایرانی (سند S)
# ایمیج اپ در CI ساخته و push می‌شود؛ روی سرور فقط pull می‌شود،
# چون npm install از داخل ایران به رجیستری نمی‌رسد (بند S.4).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC                       # سرور روی UTC، نمایش روی تهران
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../server/db:/docker-entrypoint-initdb.d:ro
    networks: [internal]            # عمداً بدون ports: از بیرون دیده نمی‌شود
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-registry.example.ir/talkora/app:latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal, web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  worker:
    image: ${APP_IMAGE:-registry.example.ir/talkora/app:latest}
    restart: unless-stopped
    command: ["node", "dist/workers/index.js"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # آپلود ضبط، پهنای باند خروجی را در ساعات کلاس نگیرد (بند S.7)
      RECORDING_UPLOAD_MAX_MBPS: ${RECORDING_UPLOAD_MAX_MBPS:-20}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
      - ./www:/var/www/certbot:ro
    depends_on: [app]
    networks: [web]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
         pg_dump -h db -U $$POSTGRES_USER $$POSTGRES_DB | gzip |
         openssl enc -aes-256-cbc -pbkdf2 -pass pass:$$BACKUP_PASSPHRASE
         > /backups/db-$$(date +%%F-%%H%%M).sql.gz.enc;
         find /backups -name '*.enc' -mtime +14 -delete;
         sleep 86400;
       done"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  certs:

networks:
  internal: {internal: true}   # بدون دسترسی به اینترنت و بدون دسترسی از بیرون
  web:
