<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070C14" media="(prefers-color-scheme: dark)">
<title>تاکورا | پنل ادمین</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F2A54'/%3E%3Ctext x='32' y='45' font-size='34' font-family='Tahoma,sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E%D8%A7%3C/text%3E%3C/svg%3E">
<link rel="preload" href="../fonts/dana-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/dana-bold.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ═══════════════════════════════════════════════════════════
   TALKORA — پنل ادمین محصول
   عمداً از پنل آموزشگاه‌ها جداست: نشست جدا، رمز جدا، ظاهر جدا.
   رنگ سرمه‌ای تیره تا هیچ‌وقت با پنل آبی آموزشگاه اشتباه نشود.
   ═══════════════════════════════════════════════════════════ */

@font-face{font-family:"Dana";src:url("../fonts/dana-light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Dana";src:url("../fonts/dana-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dana";src:url("../fonts/dana-bold.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  --paper:#F6F8FB; --surface:#FFFFFF; --surface-2:#F0F3F8; --surface-3:#E6EBF3;
  --ink:#0B1220; --ink-2:#3D4C63; --ink-3:#5A6A85;
  --line:#E2E8F0; --line-2:#CBD5E1;
  --brand:#0F2A54; --brand-2:#2563C7; --brand-soft:#E9F0FB; --ring:rgba(37,99,199,.3);
  --ok:#0A7048; --ok-soft:#E4F4EC;
  --warn:#A65F00; --warn-soft:#FBF1E0;
  --bad:#B42318; --bad-soft:#FCEAE8;
  --r1:9px; --r2:14px;
  --sh:0 1px 2px rgba(11,18,32,.05),0 2px 8px rgba(11,18,32,.05);
  --sh-l:0 22px 56px rgba(11,18,32,.18);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#070C14; --surface:#101825; --surface-2:#17202E; --surface-3:#1F2937;
  --ink:#EEF3F9; --ink-2:#B9C6D6; --ink-3:#8496AC;
  --line:#1F2937; --line-2:#2E3A4C;
  --brand:#C9DDF7; --brand-2:#6BA0EA; --brand-soft:#13233A; --ring:rgba(107,160,234,.34);
  --ok:#43C08C; --ok-soft:#0E2A20;
  --warn:#DFA24A; --warn-soft:#2A200F;
  --bad:#F0736A; --bad-soft:#2B1514;
  --sh:0 1px 2px rgba(0,0,0,.45); --sh-l:0 22px 56px rgba(0,0,0,.62);
}}
:root[data-theme="dark"]{
  --paper:#070C14; --surface:#101825; --surface-2:#17202E; --surface-3:#1F2937;
  --ink:#EEF3F9; --ink-2:#B9C6D6; --ink-3:#8496AC;
  --line:#1F2937; --line-2:#2E3A4C;
  --brand:#C9DDF7; --brand-2:#6BA0EA; --brand-soft:#13233A; --ring:rgba(107,160,234,.34);
  --ok:#43C08C; --ok-soft:#0E2A20;
  --warn:#DFA24A; --warn-soft:#2A200F;
  --bad:#F0736A; --bad-soft:#2B1514;
  --sh:0 1px 2px rgba(0,0,0,.45); --sh-l:0 22px 56px rgba(0,0,0,.62);
}
:root[data-theme="light"]{
  --paper:#F6F8FB; --surface:#FFFFFF; --surface-2:#F0F3F8; --surface-3:#E6EBF3;
  --ink:#0B1220; --ink-2:#3D4C63; --ink-3:#5A6A85;
  --line:#E2E8F0; --line-2:#CBD5E1;
  --brand:#0F2A54; --brand-2:#2563C7; --brand-soft:#E9F0FB;
  --ok:#0A7048; --ok-soft:#E4F4EC; --warn:#A65F00; --warn-soft:#FBF1E0;
  --bad:#B42318; --bad-soft:#FCEAE8;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Dana",system-ui,Tahoma,sans-serif;background:var(--paper);color:var(--ink);
     font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:where(button){background:none;border:none;padding:0;color:inherit}
input,select,textarea{font:inherit}
a{color:var(--brand-2)}

/* ── چیدمان ── */
.shell{display:grid;grid-template-columns:236px 1fr;min-block-size:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);
      display:flex;flex-direction:column;position:sticky;top:0;block-size:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;
       border-block-end:1px solid var(--line);font-weight:700}
.brand i{inline-size:32px;block-size:32px;border-radius:9px;background:var(--brand);color:#fff;
         display:grid;place-content:center;font-size:16px;font-style:normal}
:root[data-theme="dark"] .brand i,
@media (prefers-color-scheme:dark){.brand i{color:#07111F}}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);line-height:1.4}
nav{padding:10px 8px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:9px;inline-size:100%;text-align:start;
           padding:9px 11px;border-radius:var(--r1);font-size:14px;color:var(--ink-2);margin-block-end:2px}
nav button:hover{background:var(--surface-2)}
nav button.on{background:var(--brand-soft);color:var(--brand-2);font-weight:700}
nav .grp{font-size:11px;color:var(--ink-3);padding:14px 11px 5px;font-weight:700;letter-spacing:.02em}
.side-f{padding:12px;border-block-start:1px solid var(--line);display:flex;gap:8px;align-items:center}
.side-f .who{flex:1;min-inline-size:0;font-size:13px}
.side-f .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-f .who span{color:var(--ink-3);font-size:11.5px}

.main{min-inline-size:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--surface);
     border-block-end:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;flex:1}
.page{padding:22px;max-inline-size:1080px;inline-size:100%}

/* ── اجزا ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
      box-shadow:var(--sh);margin-block-end:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-block-end:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;flex:1}
.card-b{padding:18px}
.hint{display:block;font-size:12.5px;color:var(--ink-3);margin-block-start:5px;line-height:1.7}
.muted{color:var(--ink-3)}

.grid{display:grid;gap:14px}
.grid>*{min-inline-size:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:15px 16px}
.kpi .l{font-size:12.5px;color:var(--ink-3)}
.kpi .v{font-size:25px;font-weight:700;line-height:1.35;margin-block-start:3px}
.kpi .d{font-size:12.5px;color:var(--ink-3)}

.fld{margin-block-end:15px}
.fld label{display:block;font-size:13.5px;font-weight:700;margin-block-end:6px}
.fld input,.fld select,.fld textarea{inline-size:100%;padding:10px 12px;border:1px solid var(--line-2);
  border-radius:var(--r1);background:var(--surface);color:var(--ink);min-block-size:44px}
.fld textarea{min-block-size:90px;resize:vertical;line-height:1.8}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand-2);
  box-shadow:0 0 0 3px var(--ring)}
.rq{color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;
     border-radius:var(--r1);font-weight:700;font-size:14px;min-block-size:44px;border:1px solid transparent}
.btn--p{background:var(--brand-2);color:#fff}
.btn--p:hover{filter:brightness(1.07)}
.btn--g{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--g:hover{background:var(--surface-2)}
.btn--d{background:var(--bad-soft);color:var(--bad);border-color:currentColor}
.btn--sm{padding:6px 11px;min-block-size:34px;font-size:13px}
.btn--b{inline-size:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:12px;font-weight:700}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--brand-soft);color:var(--brand-2)}
.p-mute{background:var(--surface-2);color:var(--ink-3)}

.tbl-wrap{overflow-x:auto}
table{inline-size:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;padding:10px 14px;background:var(--surface-2);color:var(--ink-3);
   font-size:12px;font-weight:700;white-space:nowrap}
td{padding:11px 14px;border-block-start:1px solid var(--line);vertical-align:top}

.empty{padding:38px 22px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-block-end:5px}

.note{padding:12px 14px;border-radius:var(--r1);font-size:13.5px;line-height:1.8;margin-block-end:14px}
.note--i{background:var(--brand-soft);color:var(--ink-2);border:1px solid var(--line)}
.note--w{background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}
.note--e{background:var(--bad-soft);color:var(--bad);border:1px solid currentColor}
.note--k{background:var(--ok-soft);color:var(--ok);border:1px solid currentColor}

/* ── ورود ── */
.login{min-block-size:100vh;display:grid;place-content:center;justify-items:center;padding:24px}
.login .box{inline-size:min(410px,100%);background:var(--surface);border:1px solid var(--line);
            border-radius:var(--r2);padding:30px 26px;box-shadow:var(--sh-l)}
.login h1{font-size:21px;margin:0 0 6px}
.login p.sub{color:var(--ink-3);font-size:13.5px;margin:0 0 22px;line-height:1.8}
.login .mark{inline-size:48px;block-size:48px;border-radius:14px;background:var(--brand);color:#fff;
             display:grid;place-content:center;font-size:22px;font-weight:700;margin-block-end:16px}

/* ── نوار پیام ── */
.toasts{position:fixed;inset-block-end:20px;inset-inline-start:20px;z-index:80;display:flex;
        flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r1);
       font-size:13.5px;box-shadow:var(--sh-l);animation:up .22s}
@keyframes up{from{opacity:0;transform:translateY(8px)}}

.boot{position:fixed;inset:0;z-index:90;display:grid;place-content:center;background:var(--paper)}

@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;block-size:auto;border-inline-end:none;border-block-end:1px solid var(--line)}
  nav{display:flex;flex-wrap:wrap;gap:4px}
  nav button{inline-size:auto}
  nav .grp{display:none}
  .page{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<div class="boot" id="boot"><span class="muted">در حال بارگذاری…</span></div>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ══════════ کمکی‌ها ══════════ */
var FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function fa(n){return String(n).replace(/[0-9]/g,function(d){return FA[+d];});}
function faG(n){return fa(String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"٬"));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function enDigits(s){return String(s)
  .replace(/[۰-۹]/g,function(d){return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d));})
  .replace(/[٠-٩]/g,function(d){return String("٠١٢٣٤٥٦٧٨٩".indexOf(d));});}
function pad(n){return n<10?"0"+n:""+n;}

/* تقویم شمسی — همان الگوریتمی که پنل آموزشگاه استفاده می‌کند */
var J_M=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function toJalali(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979; gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+(~~((gy2+3)/4))-(~~((gy2+99)/100))+(~~((gy2+399)/400))-80+gd+gdm[gm-1];
  jy+=33*(~~(days/12053)); days%=12053;
  jy+=4*(~~(days/1461));   days%=1461;
  if(days>365){jy+=~~((days-1)/365); days=(days-1)%365;}
  var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function jDateTime(s){
  if(!s)return "—";
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m)return "—";
  var j=toJalali(+m[1],+m[2],+m[3]);
  var t=String(s).match(/(\d{2}):(\d{2})/);
  return fa(j[2])+" "+J_M[j[1]-1]+" "+fa(j[0])+(t?"، "+fa(t[1]+":"+t[2]):"");
}

function toast(msg){
  var d=document.createElement("div");
  d.className="toast"; d.textContent=msg;
  el("toasts").appendChild(d);
  setTimeout(function(){d.remove();},4200);
}

/* ══════════ ارتباط با سرور ══════════ */
var API={base:"../api/",admin:null,needsSetup:false};

function call(body){
  return fetch(API.base+"admin.php",{
    method:"POST",credentials:"same-origin",
    headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(j){return j;},function(){
      return {ok:false,error:"bad_response",message:"پاسخ سرور خوانده نشد."};});
  },function(){
    return {ok:false,error:"offline",message:"ارتباط با سرور برقرار نشد."};
  });
}

/* ══════════ وضعیت ══════════ */
var S={view:"dash",settings:null,leads:null,stats:null,events:null,busy:false,err:""};

var NAV=[
  {g:"مرور"},
  {v:"dash",t:"پیشخوان"},
  {v:"leads",t:"درخواست‌های دمو"},
  {g:"سایت"},
  {v:"pricing",t:"قیمت‌ها"},
  {v:"contact",t:"تماس و ایمیل"},
  {v:"content",t:"متن‌های سایت"},
  {v:"trust",t:"نمادها و وضعیت"},
  {g:"سامانه"},
  {v:"events",t:"رویدادها"},
  {v:"account",t:"حساب من"}
];

var TITLES={dash:"پیشخوان",leads:"درخواست‌های دموی رایگان",pricing:"قیمت‌ها",
  contact:"تماس و ایمیل",content:"متن‌های سایت",trust:"نمادها و وضعیت",
  events:"رویدادهای اخیر",account:"حساب من"};

/* ══════════ نماها ══════════ */

function h(strings){var out=strings[0];
  for(var i=1;i<arguments.length;i++){out+=arguments[i]+strings[i];} return out;}

function kpi(l,v,d){
  return '<div class="kpi"><div class="l">'+l+'</div><div class="v num">'+v+'</div>'+
         (d?'<div class="d">'+d+'</div>':'')+'</div>';
}

/* ── ورود ── */
function viewLogin(){
  var setup=API.needsSetup;
  return h`
  <div class="login"><div class="box">
    <div class="mark">ا</div>
    <h1>${setup?"ساخت حساب ادمین":"پنل ادمین تاکورا"}</h1>
    <p class="sub">${setup
      ?"هنوز هیچ ادمینی ساخته نشده. برای ساخت اولین حساب، کلید راه‌اندازی را که در config.php گذاشته‌اید وارد کنید."
      :"این پنل مال شماست، نه آموزشگاه‌ها. با نام کاربری و رمز وارد شوید."}</p>

    ${setup?h`
    <div class="fld"><label for="lgKey">کلید راه‌اندازی <span class="rq">*</span></label>
      <input id="lgKey" type="password" dir="ltr" style="text-align:end" autocomplete="off">
      <span class="hint">همان مقدار admin_setup_key در api/config.php</span></div>
    <div class="fld"><label for="lgName">نام شما</label>
      <input id="lgName" type="text"></div>`:""}

    <div class="fld"><label for="lgUser">نام کاربری <span class="rq">*</span></label>
      <input id="lgUser" type="text" dir="ltr" style="text-align:end" autocomplete="username"
             autocapitalize="off" spellcheck="false"></div>
    <div class="fld"><label for="lgPass">رمز عبور <span class="rq">*</span></label>
      <input id="lgPass" type="password" dir="ltr" style="text-align:end"
             autocomplete="${setup?"new-password":"current-password"}">
      ${setup?'<span class="hint">حداقل ۱۰ نویسه. جایی امن نگهش دارید؛ بازیابی خودکار ندارد.</span>':""}</div>

    ${S.err?h`<div class="note note--e">${esc(S.err)}</div>`:""}

    <button class="btn btn--p btn--b" data-a="${setup?"setup":"login"}" ${S.busy?"disabled":""}>
      ${S.busy?"صبر کنید…":(setup?"ساخت حساب و ورود":"ورود")}</button>

    <p class="hint" style="margin-block-start:16px">
      ورود آموزشگاه‌ها از <a href="../">صفحهٔ پنل</a> است، نه اینجا.</p>
  </div></div>`;
}

/* ── پیشخوان ── */
function viewDash(){
  var s=S.stats;
  if(!s)return '<div class="card"><div class="empty">در حال بارگذاری…</div></div>';
  return h`
  ${s.leadsNew>0?h`<div class="note note--w">
    <b>${fa(s.leadsNew)} درخواست دموی رسیدگی‌نشده</b> —
    <button class="btn btn--sm btn--g" data-go="leads">دیدن</button></div>`:""}

  <div class="grid g4" style="margin-block-end:16px">
    ${kpi("آموزشگاه",fa(s.institutes))}
    ${kpi("کاربر",fa(s.users))}
    ${kpi("کلاس",fa(s.classes),fa(s.published)+" منتشر شده")}
    ${kpi("درخواست دمو",fa(s.leadsNew),"رسیدگی‌نشده")}
  </div>
  <div class="grid g4" style="margin-block-end:16px">
    ${kpi("مدیر",fa(s.managers))}
    ${kpi("مدرس",fa(s.teachers))}
    ${kpi("زبان‌آموز",fa(s.students))}
    ${kpi("پیامک امروز",fa(s.otpToday),"کد ورود")}
  </div>
  <div class="grid g3">
    ${kpi("جلسهٔ ساخته‌شده",fa(s.sessions))}
    ${kpi("جلسهٔ برگزارشده",fa(s.held))}
    ${kpi("پاسخ تکلیف",fa(s.submissions))}
  </div>

  <div class="card" style="margin-block-start:16px"><div class="card-b">
    <p class="muted" style="margin:0">
      اینجا فقط شمارش می‌بینید. محتوای آموزشگاه‌ها — زبان‌آموز، تکلیف، نمره —
      از پنل ادمین قابل دیدن نیست. برای ادارهٔ کسب‌وکار عدد لازم است، نه دادهٔ مشتری.
    </p></div></div>`;
}

/* ── سرنخ‌ها ── */
var LEAD_FA={new:"تازه",contacted:"تماس گرفته شد",won:"مشتری شد",lost:"از دست رفت"};
var LEAD_CLS={new:"warn",contacted:"info",won:"ok",lost:"mute"};

function viewLeads(){
  var d=S.leads;
  if(!d)return '<div class="card"><div class="empty">در حال بارگذاری…</div></div>';
  if(!d.leads.length){
    return h`<div class="card"><div class="empty">
      <b>هنوز درخواستی نیامده</b>
      <p>هر کس فرم «دموی رایگان» سایت را پر کند، اینجا می‌آید و یک ایمیل هم
         به آدرسی که در بخش «تماس و ایمیل» گذاشته‌اید فرستاده می‌شود.</p></div></div>`;
  }
  return h`
  <div class="grid g4" style="margin-block-end:16px">
    ${["new","contacted","won","lost"].map(function(k){
      return kpi(LEAD_FA[k],fa(d.counts[k]||0));}).join("")}
  </div>
  <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>نام</th><th>تماس</th><th>آموزشگاه</th><th>زمان</th><th>وضعیت</th><th></th></tr></thead>
    <tbody>${d.leads.map(function(l){
      return h`<tr>
        <td><b>${esc(l.name)}</b>${l.note?'<br><span class="muted">'+esc(l.note.slice(0,90))+'</span>':""}</td>
        <td class="num" dir="ltr" style="text-align:end">${fa(l.phone)}
            ${l.email?'<br><span dir="ltr">'+esc(l.email)+'</span>':""}
            ${l.mailed?"":'<br><span class="pill p-bad">ایمیل نرفت</span>'}</td>
        <td>${esc(l.institute||"—")}${l.students?'<br><span class="muted">'+esc(l.students)+'</span>':""}</td>
        <td class="num">${jDateTime(l.at)}</td>
        <td><span class="pill p-${LEAD_CLS[l.status]||"mute"}">${LEAD_FA[l.status]||l.status}</span></td>
        <td><select data-lead="${l.id}" style="padding:5px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)">
          ${["new","contacted","won","lost"].map(function(k){
            return '<option value="'+k+'"'+(l.status===k?" selected":"")+'>'+LEAD_FA[k]+'</option>';}).join("")}
        </select></td></tr>`;}).join("")}
    </tbody></table></div></div>`;
}

/* ── فرم‌های تنظیمات ── */
function setField(key,label,hint,type){
  var v=S.settings?S.settings[key]:"";
  if(type==="textarea"){
    return h`<div class="fld"><label for="f_${key}">${label}</label>
      <textarea id="f_${key}" data-k="${key}" dir="auto">${esc(v)}</textarea>
      ${hint?'<span class="hint">'+hint+'</span>':""}</div>`;
  }
  if(type==="toggle"){
    return h`<div class="fld"><label for="f_${key}">${label}</label>
      <select id="f_${key}" data-k="${key}">
        <option value="1"${v==="1"?" selected":""}>روشن</option>
        <option value="0"${v!=="1"?" selected":""}>خاموش</option></select>
      ${hint?'<span class="hint">'+hint+'</span>':""}</div>`;
  }
  return h`<div class="fld"><label for="f_${key}">${label}</label>
    <input id="f_${key}" data-k="${key}" type="${type||"text"}"
           ${type==="email"||type==="tel"?'dir="ltr" style="text-align:end"':""} value="${esc(v)}">
    ${hint?'<span class="hint">'+hint+'</span>':""}</div>`;
}

/** قیمت‌ها در دیتابیس ریال‌اند و در فرم تومان — بند P.5 */
function priceField(key,label,hint){
  var rial=+(S.settings&&S.settings[key]||0);
  return h`<div class="fld"><label for="f_${key}">${label}</label>
    <input id="f_${key}" data-k="${key}" data-money="1" type="text" inputmode="numeric"
           value="${rial?faG(Math.round(rial/10)):""}">
    <span class="hint">${hint} — به تومان وارد کنید</span></div>`;
}

function saveBar(){
  return h`<div class="card-b" style="border-block-start:1px solid var(--line);display:flex;gap:10px;align-items:center">
    <button class="btn btn--p" data-a="save" ${S.busy?"disabled":""}>${S.busy?"در حال ذخیره…":"ذخیره"}</button>
    <span class="muted" style="font-size:13px">تغییرات بلافاصله روی سایت اعمال می‌شود.</span></div>`;
}

    صفحهٔ تعرفهٔ سایت و محاسبه‌گرش هر دو از همین اعداد می‌خوانند.
  </div>

    <div class="card-h"><h3>تعرفهٔ ماهانه</h3></div>

  "admin.login_failed":"ورود ناموفق ادمین","admin.settings_saved":"تنظیمات ذخیره شد",
  "otp.send_failed":"ارسال پیامک ناموفق","admin.rate_limited":"سقف تلاش ادمین",
  "otp.rate_limited_ip":"سقف درخواست پیامک"};

function viewEvents(){

  <div class="note note--i">ورودهای ناموفق و ارسال‌های ناموفق پیامک را اینجا ببینید.
    اگر «ورود ناموفق ادمین» پشت سر هم دیدید، رمزتان را عوض کنید.</div>

      return h`<tr>
        <td>${bad?'<span class="pill p-bad">'+esc(EV_FA[e.action]||e.action)+'</span>'

        <td class="num">${jDateTime(e.at)}</td></tr>`;}).join("")}

var VIEWS={dash:viewDash,leads:viewLeads,pricing:viewPricing,contact:viewContact,
           content:viewContent,trust:viewTrust,events:viewEvents,account:viewAccount};

/* ══════════ رندر ══════════ */
function render(){
  if(!API.admin){el("app").innerHTML=viewLogin();focusFirst();return;}
  el("app").innerHTML=h`
  <div class="shell">
    <aside class="side">
      <div class="brand"><i>ا</i><span>تاکورا<small>پنل ادمین</small></span></div>
      <nav>${NAV.map(function(n){
        if(n.g)return '<div class="grp">'+n.g+'</div>';
        return '<button class="'+(S.view===n.v?"on":"")+'" data-go="'+n.v+'">'+n.t+'</button>';
      }).join("")}</nav>
      <div class="side-f">
        <div class="who"><b>${esc(API.admin.name||API.admin.username)}</b>
          <span dir="ltr">${esc(API.admin.username)}</span></div>
        <button class="btn btn--g btn--sm" data-a="theme" aria-label="روشن و تاریک">◐</button>
      </div>
    </aside>
    <div class="main">
      <header class="top"><h1>${TITLES[S.view]||""}</h1>
        <a class="btn btn--g btn--sm" href="../" target="_blank" rel="noopener">پنل آموزشگاه‌ها</a></header>
      <div class="page">${(VIEWS[S.view]||viewDash)()}</div>
    </div>
  </div>`;
}

function focusFirst(){
  var f=document.querySelector("#app input");
  if(f)f.focus();
}

/* ══════════ بارگذاری داده ══════════ */
function need(view){
  if(view==="dash"&&!S.stats)      return call({action:"stats"}).then(function(r){if(r.ok)S.stats=r.stats;});
  if(view==="leads"&&!S.leads)     return call({action:"leads"}).then(function(r){if(r.ok)S.leads=r;});
  if(view==="events"&&!S.events)   return call({action:"recent"}).then(function(r){if(r.ok)S.events=r.events;});
  if(!S.settings&&["pricing","contact","content","trust"].indexOf(view)>=0){
    return call({action:"settings"}).then(function(r){if(r.ok)S.settings=r.settings;});
  }
  return Promise.resolve();
}

function goView(v){
  S.view=v; render();
  need(v).then(render);
}

/* ══════════ کنش‌ها ══════════ */
function readForm(){
  var out={};
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(f){
    var v=f.value;
    if(f.dataset.money==="1"){
      // تومان → ریال. جداکنندهٔ فارسی و لاتین هر دو حذف می‌شود.
      var t=+enDigits(String(v).replace(/[٬,\s]/g,""))||0;
      v=String(t*10);
    }
    out[f.dataset.k]=v;
  });
  return out;
}

document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){goView(g.dataset.go);return;}

  var b=e.target.closest("[data-a]");
  if(!b)return;
  var a=b.dataset.a;

  if(a==="theme"){
    var root=document.documentElement, cur=root.getAttribute("data-theme");
    if(!cur)cur=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    root.setAttribute("data-theme",cur==="dark"?"light":"dark");
    return;
  }

  if(a==="login"||a==="setup"){
    if(S.busy)return;
    var u=(el("lgUser")||{}).value||"", p=(el("lgPass")||{}).value||"";
    if(!u.trim()||!p){S.err="نام کاربری و رمز را وارد کنید.";render();return;}
    var body={action:a==="setup"?"bootstrap":"login",username:u.trim(),password:p};
    if(a==="setup"){
      body.setupKey=(el("lgKey")||{}).value||"";
      body.fullName=(el("lgName")||{}).value||"";
      if(!body.setupKey){S.err="کلید راه‌اندازی را وارد کنید.";render();return;}
      if(p.length<10){S.err="رمز باید حداقل ۱۰ نویسه باشد.";render();return;}
    }
    S.busy=true; S.err=""; render();
    call(body).then(function(r){
      S.busy=false;
      if(!r.ok){S.err=r.message||"ورود نشد.";render();return;}
      API.admin=r.admin; API.needsSetup=false; S.err="";
      goView("dash");
      toast("خوش آمدید");
    });
    return;
  }

  if(a==="save"){
    if(S.busy)return;
    /*
     * فرم را *قبل* از render می‌خوانیم.
     * render صفحه را از روی S.settings دوباره می‌سازد، یعنی هرچه کاربر
     * تایپ کرده پاک می‌شود. اگر بعدش بخوانیم، مقدار قدیمی را می‌فرستیم
     * و تغییر کاربر بی‌صدا گم می‌شود — که بدترین نوع اشکال است، چون
     * پیام «ذخیره شد» هم می‌گیرد.
     */
    var payload=readForm();
    S.busy=true; render();
    call({action:"saveSettings",settings:payload}).then(function(r){
      S.busy=false;
      if(!r.ok){render();toast(r.message||"ذخیره نشد");return;}
      S.settings=r.settings; render(); toast("ذخیره شد");
    });
    return;
  }

  if(a==="testmail"){
    toast("در حال ارسال…");
    call({action:"testMail"}).then(function(r){
      toast(r.ok?"ایمیل آزمایشی فرستاده شد":(r.message||"ارسال نشد"));
    });
    return;
  }

  if(a==="passwd"){
    if(S.busy)return;
    var o=(el("pwOld")||{}).value||"", n=(el("pwNew")||{}).value||"", n2=(el("pwNew2")||{}).value||"";
    if(n.length<10){toast("رمز تازه باید حداقل ۱۰ نویسه باشد");return;}
    if(n!==n2){toast("تکرار رمز با خودش نمی‌خواند");return;}
    S.busy=true;
    call({action:"password",current:o,new:n}).then(function(r){
      S.busy=false; render();
      toast(r.ok?"رمز عوض شد":(r.message||"عوض نشد"));
    });
    return;
  }

  if(a==="logout"){
    call({action:"logout"}).then(function(){
      API.admin=null; S.settings=S.leads=S.stats=S.events=null;
      render(); toast("خارج شدید");
    });
    return;
  }
});

document.addEventListener("change",function(e){
  var l=e.target.closest&&e.target.closest("[data-lead]");
  if(!l)return;
  call({action:"leadUpdate",id:l.dataset.lead,status:l.value}).then(function(r){
    if(!r.ok){toast(r.message||"ثبت نشد");return;}
    S.leads=null; need("leads").then(render);
    toast("وضعیت ثبت شد");
  });
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!API.admin&&e.target.tagName==="INPUT"){
    var btn=document.querySelector("[data-a='login'],[data-a='setup']");
    if(btn)btn.click();
  }
});

/* ══════════ بالا آمدن ══════════ */
call({action:"me"}).then(function(r){
  el("boot").remove();
  if(r&&r.ok&&r.authenticated){API.admin=r.admin; goView("dash");}
  else{API.needsSetup=!!(r&&r.needsSetup); render();}
},function(){
  el("boot").remove();
  S.err="ارتباط با سرور برقرار نشد. api/admin.php در دسترس نیست.";
  render();
});
})();
</script>

</html>
