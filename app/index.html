<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070C14" media="(prefers-color-scheme: dark)">
<title>تاکورا | پنل آموزشگاه، مدرس و زبان‌آموز</title>
<meta name="description" content="ورود به پنل تاکورا برای مدیر آموزشگاه، مدرس و زبان‌آموز.">

<link rel="preload" href="../site/fonts/dana-bold.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ═══════════════════════════════════════════════════════════
   TALKORA — نمونهٔ تعاملی پنل‌ها
   سیستم طراحی: docs/M-ui-ux-direction.md
   بازار: docs/P-iran-market.md | کلاس آنلاین: docs/Q | تکالیف: docs/R
   ═══════════════════════════════════════════════════════════ */

@font-face{font-family:"Dana";src:url("../site/fonts/dana-light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Dana";src:url("../site/fonts/dana-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dana";src:url("../site/fonts/dana-bold.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --surface-2:#F1F4F8; --surface-3:#E6ECF4;
  --ink:#0B1220; --ink-2:#2C3A56; --ink-3:#5A6A85;
  --line:#E1E7EF; --line-2:#CBD5E1;
  --brand:#2563C7; --brand-deep:#0F2A54; --brand-soft:#E9F0FB; --ring:rgba(37,99,199,.3);
  --accent:#D98324; --accent-soft:#FBF0E1;
  --ok:#0A7048; --ok-soft:#E4F4EC;
  --warn:#A65F00; --warn-soft:#FBF1E0;
  --bad:#B42318; --bad-soft:#FCEAE8;
  --live:#C2185B; --live-soft:#FCE8EF;
  --sh-sm:0 1px 2px rgba(11,18,32,.05),0 2px 8px rgba(11,18,32,.05);
  --sh-md:0 8px 26px rgba(11,18,32,.09);
  --sh-lg:0 22px 56px rgba(11,18,32,.16);
  --r1:6px; --r2:10px; --r3:14px; --r4:20px;
  --nav-w:246px; --top-h:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#070C14; --surface:#101825; --surface-2:#17202E; --surface-3:#1F2937;
  --ink:#EEF3F9; --ink-2:#B9C6D6; --ink-3:#8496AC;
  --line:#1F2937; --line-2:#2E3A4C;
  --brand:#6BA0EA; --brand-deep:#C9DDF7; --brand-soft:#13233A; --ring:rgba(107,160,234,.34);
  --accent:#E9A24E; --accent-soft:#2A1F11;
  --ok:#43C08C; --ok-soft:#0E2A20;
  --warn:#DFA24A; --warn-soft:#2A200F;
  --bad:#F0736A; --bad-soft:#2B1514;
  --live:#F06292; --live-soft:#2C1119;
  --sh-sm:0 1px 2px rgba(0,0,0,.45); --sh-md:0 8px 26px rgba(0,0,0,.5); --sh-lg:0 22px 56px rgba(0,0,0,.62);
}}
:root[data-theme="dark"]{
  --paper:#070C14; --surface:#101825; --surface-2:#17202E; --surface-3:#1F2937;
  --ink:#EEF3F9; --ink-2:#B9C6D6; --ink-3:#8496AC;
  --line:#1F2937; --line-2:#2E3A4C;
  --brand:#6BA0EA; --brand-deep:#C9DDF7; --brand-soft:#13233A; --ring:rgba(107,160,234,.34);
  --accent:#E9A24E; --accent-soft:#2A1F11;
  --ok:#43C08C; --ok-soft:#0E2A20;
  --warn:#DFA24A; --warn-soft:#2A200F;
  --bad:#F0736A; --bad-soft:#2B1514;
  --live:#F06292; --live-soft:#2C1119;
  --sh-sm:0 1px 2px rgba(0,0,0,.45); --sh-md:0 8px 26px rgba(0,0,0,.5); --sh-lg:0 22px 56px rgba(0,0,0,.62);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body.lt{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Dana",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.lt h1,.lt h2,.lt h3,.lt h4{margin:0;font-weight:700;line-height:1.5;text-wrap:balance}
.lt p{margin:0}.lt ul{margin:0;padding:0;list-style:none}
.lt a{color:inherit;text-decoration:none}
.lt button,.lt input,.lt select,.lt textarea{font:inherit;color:inherit}
.lt button{cursor:pointer}
:where(.lt button){background:none;border:none;padding:0}  /* ویژگی‌مندی صفر تا کلاس‌ها همیشه ببرند */
.lt :focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring);border-radius:var(--r1)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* شکل‌های CSS — فونت دانا برای ✓ · — ← ▲ ▼ گلیف ندارد */
.ck{display:inline-block;inline-size:.42em;block-size:.74em;flex:none;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg);margin-block-end:.2em}
.chev{display:inline-block;inline-size:.4em;block-size:.4em;flex:none;
  border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.chev--r{transform:rotate(-135deg)}
.tri{display:inline-block;inline-size:0;block-size:0;flex:none;
  border-left:4px solid transparent;border-right:4px solid transparent}
.tri--up{border-bottom:5px solid currentColor}
.tri--down{border-top:5px solid currentColor}
.metaline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.metaline>span{display:inline-flex;align-items:center;gap:8px;unicode-bidi:isolate}
.dash{display:inline-block;inline-size:12px;block-size:1.5px;background:currentColor;opacity:.5;vertical-align:middle}
.metaline>span:not(:last-child)::after{content:"";inline-size:3px;block-size:3px;
  border-radius:50%;background:currentColor;opacity:.36;flex:none}

/* ───── دکمه ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-block-size:40px;padding-inline:16px;border-radius:var(--r2);border:1px solid transparent;
  font-weight:700;font-size:14px;transition:background .15s,border-color .15s,color .15s,transform .12s}
.btn:active{transform:translateY(1px)}
.btn--p{background:var(--brand);color:#fff;border-color:var(--brand)}
:root[data-theme="dark"] .btn--p{color:#07111F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn--p{color:#07111F}}
.btn--p:hover{background:var(--brand-deep)}
:root[data-theme="dark"] .btn--p:hover{background:#8FB9F0}
.btn--g{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--g:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn--q{color:var(--ink-2)}
.btn--q:hover{background:var(--surface-2)}
.btn--d{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn--live{background:var(--live);color:#fff;border-color:var(--live)}
.btn--sm{min-block-size:32px;padding-inline:11px;font-size:13px}
.btn--lg{min-block-size:48px;padding-inline:22px;font-size:15.5px}
.btn--b{inline-size:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ───── پوسته ───── */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-block-size:100dvh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;block-size:100dvh}
.brand{display:flex;align-items:center;gap:9px;padding:15px 18px;border-block-end:1px solid var(--line);
  font-weight:700;font-size:16.5px;flex:none}
.brand-mark{inline-size:28px;block-size:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-deep));color:#fff;font-size:14px}
:root[data-theme="dark"] .brand-mark{background:linear-gradient(150deg,#3E7FD8,#1B3E6E);color:#EAF2FD}
.side-scroll{flex:1;overflow-y:auto;padding:10px}
.nav-grp{font-size:11px;font-weight:700;color:var(--ink-3);padding:12px 10px 5px;letter-spacing:.03em}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r2);
  font-size:14.5px;color:var(--ink-2);transition:background .13s,color .13s;position:relative}
.nav-a:hover{background:var(--surface-2);color:var(--ink)}
.nav-a.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav-a .ico{inline-size:18px;block-size:18px;flex:none;opacity:.9}
.nav-a .badge{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;
  min-inline-size:19px;block-size:19px;border-radius:100px;display:grid;place-items:center;padding-inline:5px}
.nav-a.on .badge{background:var(--brand);color:#fff}
.side-foot{padding:11px;border-block-start:1px solid var(--line);flex:none}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r2);font-size:13.5px}
.me:hover{background:var(--surface-2)}
.me .av{inline-size:32px;block-size:32px;border-radius:50%;background:var(--surface-3);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--ink-2)}
.me .nm{flex:1;min-inline-size:0}
.me .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .nm span{display:block;font-size:11.5px;color:var(--ink-3)}

.scrim{display:none}   /* قانون پایه: در دسکتاپ نباید خانهٔ گرید بگیرد */
.main{min-inline-size:0;display:flex;flex-direction:column}
.top{block-size:var(--top-h);flex:none;position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);
  border-block-end:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-inline:18px}
.top h1{font-size:16.5px}
.top-r{margin-inline-start:auto;display:flex;align-items:center;gap:7px}
.ib{inline-size:34px;block-size:34px;display:grid;place-items:center;flex:none;
  border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);color:var(--ink-2)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.page{padding:20px 18px 44px;max-inline-size:1240px;inline-size:100%}
.burg{display:none}

@media (max-width:1080px){:root{--nav-w:64px} .brand span:not(.brand-mark){display:none}
  .nav-a span:not(.badge){display:none} .nav-a{justify-content:center} .nav-grp{display:none}
  .me .nm,.me .chev{display:none} .me{justify-content:center}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;inline-size:250px;z-index:60;
    transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
    border-inline-start:none;border-inline-end:1px solid var(--line);box-shadow:var(--sh-lg)}
  :root{--nav-w:0px}
  .side.open{transform:none}
  .side .brand span:not(.brand-mark){display:inline} .nav-a span{display:inline!important}
  .nav-a{justify-content:flex-start} .nav-grp{display:block} .me .nm{display:block}
  .burg{display:grid} .page{padding:14px 13px 80px}
  .scrim{position:fixed;inset:0;background:rgba(3,8,16,.5);z-index:55}
  .scrim.on{display:block}
}

/* ───── اجزای عمومی ───── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh-sm)}
.card-h{padding:14px 16px;border-block-end:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:15px}
.card-h .r{margin-inline-start:auto;display:flex;gap:7px;align-items:center}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
/* بدون این، فرزندِ گرید min-width:auto می‌گیرد و یک جدول پهن، کل ستون را
   از عرض صفحه بیرون می‌برد؛ آن‌وقت overflow-x روی .tbl-wrap بی‌اثر می‌شود. */
.grid>*{min-inline-size:0}
.grader>*{min-inline-size:0}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g-side{grid-template-columns:1.55fr 1fr}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)} .g-side{grid-template-columns:1fr}}
@media (max-width:820px){.g3,.g2{grid-template-columns:1fr}}
@media (max-width:520px){.g4{grid-template-columns:1fr}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:15px;box-shadow:var(--sh-sm)}
.kpi .l{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.25}
.kpi .d{font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:5px}
.up{color:var(--ok)} .down{color:var(--bad)}
.bar{block-size:5px;background:var(--surface-3);border-radius:100px;overflow:hidden;margin-top:9px}
.bar i{display:block;block-size:100%;background:var(--brand);border-radius:100px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;
  font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--brand-soft);color:var(--brand)}
.p-mute{background:var(--surface-2);color:var(--ink-3)}
.p-live{background:var(--live-soft);color:var(--live)}
.dot-live{inline-size:6px;block-size:6px;border-radius:50%;background:currentColor;flex:none;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

.tbl{inline-size:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:700;color:var(--ink-3);text-align:start;padding:10px 14px;
  border-block-end:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-block-end:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tbody tr:last-child td{border-block-end:none}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
.who{display:flex;align-items:center;gap:9px}
.who .av{inline-size:30px;block-size:30px;border-radius:50%;background:var(--surface-3);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;color:var(--ink-2)}
.who b{font-weight:400;font-size:14px}

.alert{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r2);
  border:1px solid var(--line);background:var(--surface-2);font-size:13.5px}
.alert+.alert{margin-top:8px}
.alert .sev{inline-size:7px;block-size:7px;border-radius:50%;flex:none}
.s-hi{background:var(--bad)} .s-md{background:var(--warn)} .s-lo{background:var(--ink-3)}
.alert .a{margin-inline-start:auto;color:var(--brand);font-weight:700;font-size:12.5px;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

.empty{text-align:center;padding:38px 18px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.empty p{font-size:13.5px;max-inline-size:44ch;margin-inline:auto;line-height:1.9}

.tabs{display:flex;gap:4px;border-block-end:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tab{padding:10px 15px;font-size:14px;font-weight:700;color:var(--ink-3);white-space:nowrap;
  border-block-end:2.5px solid transparent;margin-block-end:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-block-end-color:var(--brand)}

.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);margin-bottom:12px}
.crumb a:hover{color:var(--brand)}

/* ───── فرم ───── */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld label{font-size:13px;font-weight:700}
.fld label .rq{color:var(--bad)}
.fld input,.fld select,.fld textarea{padding:10px 12px;min-block-size:42px;background:var(--paper);
  border:1px solid var(--line-2);border-radius:var(--r2);font-size:14.5px;transition:border-color .14s,box-shadow .14s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.fld textarea{min-block-size:96px;resize:vertical;line-height:1.85}
.fld .hint{font-size:12px;color:var(--ink-3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media (max-width:600px){.frow{grid-template-columns:1fr}}

/* ───── مودال ───── */
.ov{position:fixed;inset:0;background:rgba(3,8,16,.52);z-index:80;display:none;
  align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:var(--r4);box-shadow:var(--sh-lg);
  inline-size:100%;max-inline-size:560px;max-block-size:92dvh;display:flex;flex-direction:column;
  border:1px solid var(--line)}
.modal--w{max-inline-size:780px}
.modal-h{padding:16px 20px;border-block-end:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.modal-h h3{font-size:16.5px}
.modal-h .x{margin-inline-start:auto;inline-size:32px;block-size:32px;border-radius:var(--r2);
  display:grid;place-items:center;color:var(--ink-3);font-size:20px;line-height:1}
.modal-h .x:hover{background:var(--surface-2);color:var(--ink)}
.modal-b{padding:20px;overflow-y:auto;flex:1}
.modal-f{padding:14px 20px;border-block-start:1px solid var(--line);display:flex;gap:9px;
  justify-content:flex-end;flex:none;background:var(--surface-2);
  border-end-start-radius:var(--r4);border-end-end-radius:var(--r4)}
@media (max-width:560px){.modal-f{flex-direction:column-reverse}.modal-f .btn{inline-size:100%}}

/* ───── انتخاب ارائه‌دهندهٔ کلاس آنلاین ───── */
.prov{display:flex;flex-direction:column;gap:10px}
.prov-o{display:flex;gap:12px;padding:14px;border:1.5px solid var(--line-2);border-radius:var(--r3);
  text-align:start;transition:border-color .15s,background .15s;inline-size:100%;align-items:flex-start}
.prov-o:hover{border-color:var(--brand);background:var(--surface-2)}
.prov-o[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.prov-o .rd{inline-size:18px;block-size:18px;border-radius:50%;border:2px solid var(--line-2);
  flex:none;margin-top:3px;display:grid;place-items:center}
.prov-o[aria-checked="true"] .rd{border-color:var(--brand)}
.prov-o[aria-checked="true"] .rd::after{content:"";inline-size:9px;block-size:9px;border-radius:50%;background:var(--brand)}
.prov-o .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prov-o .d{font-size:13px;color:var(--ink-3);margin-top:5px;line-height:1.8}
.prov-o .warn-note{color:var(--warn);font-weight:700}
.opt-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r2);margin-top:8px;font-size:14px}
.opt-row .sw{margin-inline-start:auto;flex:none}
.sw{inline-size:42px;block-size:24px;border-radius:100px;background:var(--line-2);position:relative;
  transition:background .16s;flex:none}
.sw::after{content:"";position:absolute;inset-block-start:3px;inset-inline-start:3px;inline-size:18px;block-size:18px;
  border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(-18px)}

/* ───── حضور و غیاب ───── */
.roster{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface)}
.rrow{inline-size:100%;display:flex;align-items:center;gap:11px;padding:11px 14px;text-align:start;
  border-block-end:1px solid var(--line);transition:background .13s}
.rrow:last-child{border-block-end:none}
.rrow:hover{background:var(--surface-2)}
.rrow .av{inline-size:34px;block-size:34px;border-radius:50%;background:var(--surface-3);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--ink-2)}
.rrow .nm{flex:1;font-size:14.5px;min-inline-size:0}
.rrow .nm small{display:block;font-size:11.5px;color:var(--ink-3)}
.rrow[data-st="absent"] .nm>span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.seg{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:100px;flex:none}
.seg button{padding:5px 11px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--ink-3);min-block-size:30px}
.seg button.on{background:var(--surface);box-shadow:var(--sh-sm);color:var(--ink)}
.seg button.on[data-v="present"]{color:var(--ok)}
.seg button.on[data-v="late"]{color:var(--warn)}
.seg button.on[data-v="absent"]{color:var(--bad)}
@media (max-width:520px){.seg button{padding:5px 8px;font-size:11.5px}.rrow{gap:8px;padding:10px}}

/* ───── تکالیف ───── */
.asg{display:flex;gap:13px;padding:15px;border:1px solid var(--line);border-radius:var(--r3);
  background:var(--surface);align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.asg:hover{border-color:var(--brand);box-shadow:var(--sh-md)}
.asg+.asg{margin-top:10px}
.asg .ic{inline-size:38px;block-size:38px;border-radius:var(--r2);display:grid;place-items:center;flex:none;
  background:var(--brand-soft);color:var(--brand)}
.asg .ic.t-speaking{background:var(--accent-soft);color:var(--accent)}
.asg .ic.t-quiz{background:var(--ok-soft);color:var(--ok)}
.asg .bd{flex:1;min-inline-size:0}
.asg .bd b{font-size:15px;display:block}
.asg .bd .m{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.asg .rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
@media (max-width:600px){.asg{flex-wrap:wrap}.asg .rt{inline-size:100%;flex-direction:row;align-items:center}}

/* ضبط صدا */
.rec{border:1px solid var(--line);border-radius:var(--r3);padding:18px;text-align:center;background:var(--surface-2)}
.rec-btn{inline-size:66px;block-size:66px;border-radius:50%;background:var(--bad);color:#fff;
  display:grid;place-items:center;margin:0 auto;box-shadow:0 4px 16px rgba(180,35,24,.34);transition:transform .15s}
.rec-btn:hover{transform:scale(1.04)}
.rec-btn.on{animation:recpulse 1.3s ease-in-out infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,24,.5)}50%{box-shadow:0 0 0 13px rgba(180,35,24,0)}}
.rec .tm{font-size:26px;font-weight:300;margin-top:13px;letter-spacing:.02em}
.rec .hl{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.wave{display:flex;align-items:center;justify-content:center;gap:2.5px;block-size:40px;margin-top:13px}
.wave i{inline-size:3px;background:var(--brand);border-radius:2px;display:block;opacity:.72;
  transition:block-size .12s ease}
.player{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r2);background:var(--surface)}
.player .pb{inline-size:38px;block-size:38px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .player .pb{color:#07111F}
.player .tr{flex:1;min-inline-size:0}
.track{block-size:5px;background:var(--surface-3);border-radius:100px;position:relative;cursor:pointer}
.track i{display:block;block-size:100%;background:var(--brand);border-radius:100px;inline-size:0%}
.track .mk{position:absolute;inset-block-start:-3px;inline-size:2px;block-size:11px;background:var(--accent);border-radius:2px}

/* ───── صفحهٔ تصحیح ───── */
.grader{display:grid;grid-template-columns:1.42fr 1fr;gap:16px;align-items:start}
@media (max-width:980px){.grader{grid-template-columns:1fr}}
.gbar{display:flex;align-items:center;gap:11px;padding:12px 15px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r3);margin-bottom:14px;flex-wrap:wrap;box-shadow:var(--sh-sm)}
.gbar .mid{flex:1;text-align:center;min-inline-size:150px}
.gbar .mid b{font-size:15px;display:block}
.gbar .mid span{font-size:12px;color:var(--ink-3)}
.gprog{block-size:4px;background:var(--surface-3);border-radius:100px;overflow:hidden;margin-top:8px;inline-size:100%}
.gprog i{display:block;block-size:100%;background:var(--ok);border-radius:100px;transition:inline-size .3s}
.work{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:18px;
  font-size:15px;line-height:2.1;box-shadow:var(--sh-sm)}
.work p+p{margin-top:13px}
.rub{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh-sm)}
.crit{padding:13px 15px;border-block-end:1px solid var(--line)}
.crit:last-of-type{border-block-end:none}
.crit .ct{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.crit .ct span{margin-inline-start:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.scale{display:flex;gap:5px;margin-top:9px}
.scale button{flex:1;min-block-size:38px;border:1px solid var(--line-2);border-radius:var(--r1);
  font-size:14px;font-weight:700;color:var(--ink-3);transition:all .13s}
.scale button:hover{border-color:var(--brand);color:var(--brand)}
.scale button.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .scale button.on{color:#07111F}
.rub-total{padding:13px 15px;border-block-start:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;gap:9px;font-weight:700}
.rub-total .v{margin-inline-start:auto;font-size:20px}
.phrases{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.phrase{padding:5px 10px;border:1px solid var(--line-2);border-radius:100px;font-size:12.5px;color:var(--ink-2)}
.phrase:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* ───── نوار وضعیت نمونه ───── */
.demo-bar{background:var(--accent-soft);border-block-end:1px solid var(--line);font-size:12.5px;
  padding:7px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:relative;z-index:40}
.demo-bar b{color:var(--accent)}
.role-sw{margin-inline-start:auto;display:flex;gap:3px;background:var(--surface);padding:3px;
  border-radius:100px;border:1px solid var(--line-2)}
.role-sw button{padding:4px 12px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.role-sw button.on{background:var(--brand);color:#fff}
:root[data-theme="dark"] .role-sw button.on{color:#07111F}

/* ───── توست ───── */
.toasts{position:fixed;inset-block-end:18px;inset-inline-start:18px;z-index:90;display:flex;
  flex-direction:column;gap:8px;max-inline-size:calc(100vw - 36px)}
.toast{background:var(--ink);color:var(--paper);padding:12px 15px;border-radius:var(--r2);
  font-size:13.5px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;
  animation:tin .22s cubic-bezier(.2,.8,.2,1)}
.toast .u{color:#7FB3F5;font-weight:700;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ───── صفحهٔ تمام‌صفحه (ورود، ثبت‌نام، تعیین سطح) ───── */
.full{display:none;min-block-size:100dvh;background:var(--paper)}
.full.on{display:block}
body.full-mode .shell,body.full-mode .demo-bar{display:none}
.auth-wrap{min-block-size:100dvh;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:900px){.auth-wrap{grid-template-columns:1fr}.auth-aside{display:none}}
.auth-aside{background:var(--brand-deep);color:#EAF1FB;padding:44px;display:flex;
  flex-direction:column;justify-content:center;gap:20px}
:root[data-theme="dark"] .auth-aside{background:var(--surface);color:var(--ink);border-inline-end:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .auth-aside{background:var(--surface);color:var(--ink);border-inline-end:1px solid var(--line)}}
.auth-aside h2{font-size:26px;line-height:1.6}
.auth-aside ul{display:flex;flex-direction:column;gap:13px;margin-top:6px}
.auth-aside li{display:flex;gap:11px;font-size:14.5px;align-items:flex-start;opacity:.86}
.auth-main{display:flex;align-items:center;justify-content:center;padding:28px 20px}
.auth-box{inline-size:100%;max-inline-size:410px}
.auth-box .brand{border:none;padding:0 0 22px;justify-content:center}
.auth-h{font-size:21px;font-weight:700;text-align:center}
.auth-p{font-size:14px;color:var(--ink-3);text-align:center;margin-top:7px;line-height:1.9}
.otp{display:flex;gap:9px;direction:ltr;justify-content:center;margin-block:20px}
.otp input{inline-size:46px;block-size:56px;text-align:center;font-size:22px;font-weight:700;
  border:1.5px solid var(--line-2);border-radius:var(--r2);background:var(--paper);
  font-variant-numeric:tabular-nums}
.otp input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.otp input.filled{border-color:var(--brand);background:var(--brand-soft)}
.au-err{margin-block:2px 14px;padding:10px 12px;border-radius:var(--r1);font-size:13.5px;
        background:var(--bad-soft);color:var(--bad);border:1px solid currentColor}
.steps-dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.steps-dots i{inline-size:26px;block-size:4px;border-radius:100px;background:var(--line-2)}
.steps-dots i.on{background:var(--brand)}

/* ───── ویزارد ───── */
.wiz{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-block-end:2px}
.wstep{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;
  font-size:13px;font-weight:700;color:var(--ink-3);background:var(--surface-2);white-space:nowrap;flex:none}
.wstep .n{inline-size:20px;block-size:20px;border-radius:50%;background:var(--surface-3);
  display:grid;place-items:center;font-size:11.5px;flex:none}
.wstep.on{background:var(--brand-soft);color:var(--brand)}
.wstep.on .n{background:var(--brand);color:#fff}
:root[data-theme="dark"] .wstep.on .n{color:#07111F}
.wstep.done{color:var(--ok)}
.wstep.done .n{background:var(--ok-soft);color:var(--ok)}

/* ───── چک‌لیست راه‌اندازی ───── */
.chk{display:flex;align-items:center;gap:12px;padding:13px 15px;border-block-end:1px solid var(--line)}
.chk:last-child{border-block-end:none}
.chk .box{inline-size:22px;block-size:22px;border-radius:50%;border:2px solid var(--line-2);
  flex:none;display:grid;place-items:center}
.chk.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.chk .tx{flex:1;font-size:14.5px}
.chk.done .tx{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.chk .tx small{display:block;font-size:12px;color:var(--ink-3);text-decoration:none}

/* ───── ترم‌ساز: جدول کلاس‌ها و تداخل ───── */
.cls-row{display:grid;grid-template-columns:1.6fr 1fr 1.2fr .8fr .7fr auto;gap:9px;
  padding:11px 13px;border-block-end:1px solid var(--line);align-items:center;font-size:13.5px}
.cls-row.head{background:var(--surface-2);font-weight:700;font-size:12px;color:var(--ink-3)}
.cls-row.bad{background:var(--bad-soft)}
.cls-row select,.cls-row input{padding:7px 9px;min-block-size:36px;font-size:13.5px;
  border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface);inline-size:100%}
.cls-row select:focus,.cls-row input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--ring)}
@media (max-width:900px){.cls-row{grid-template-columns:1fr 1fr;gap:8px}.cls-row.head{display:none}}
.conflict{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;border-radius:var(--r2);
  background:var(--bad-soft);color:var(--bad);font-size:13px;margin-top:8px}
.conflict b{font-weight:700}
.conflict .fix{margin-inline-start:auto;font-weight:700;white-space:nowrap;text-decoration:underline}

/* ───── آزمون ───── */
.q-nav{display:flex;flex-wrap:wrap;gap:6px}
.q-nav button{inline-size:34px;block-size:34px;border-radius:var(--r1);border:1px solid var(--line-2);
  font-size:13px;font-weight:700;color:var(--ink-3)}
.q-nav button.ans{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .q-nav button.ans{color:#07111F}
.q-nav button.cur{box-shadow:0 0 0 3px var(--ring)}
.opt{display:flex;align-items:center;gap:11px;padding:13px 15px;border:1.5px solid var(--line-2);
  border-radius:var(--r2);inline-size:100%;text-align:start;font-size:15px;margin-bottom:9px;
  transition:border-color .14s,background .14s}
.opt:hover{border-color:var(--brand);background:var(--surface-2)}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt .rd{inline-size:19px;block-size:19px;border-radius:50%;border:2px solid var(--line-2);
  flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .rd{border-color:var(--brand)}
.opt[aria-checked="true"] .rd::after{content:"";inline-size:9px;block-size:9px;border-radius:50%;background:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.timer-pill{font-variant-numeric:tabular-nums;font-weight:700}
.timer-pill.low{color:var(--bad)}

/* ───── ابزار حین کلاس ───── */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:16px;text-align:center}
.tool h4{font-size:14px;color:var(--ink-3);font-weight:700}
.tool .big{font-size:38px;font-weight:300;letter-spacing:.01em;margin-block:9px;line-height:1.2}
.tool .big.run{color:var(--brand)}
.tool .big.done{color:var(--bad)}
.poll-bar{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:8px}
.poll-bar .t{inline-size:74px;flex:none;text-align:start}
.poll-bar .b{flex:1;block-size:22px;background:var(--surface-2);border-radius:var(--r1);overflow:hidden}
.poll-bar .b i{display:block;block-size:100%;background:var(--brand);border-radius:var(--r1);transition:inline-size .3s}
.poll-bar .v{inline-size:34px;flex:none;text-align:end;font-weight:700}

/* ───── صفحهٔ آماده‌سازی ─────
   تا وقتی نفهمیده‌ایم بک‌اند بالاست یا نه، هیچ داشبوردی نشان نمی‌دهیم.
   وگرنه کاربرِ واقعی یک لحظه دادهٔ نمایشی می‌بیند و بعد به صفحهٔ ورود پرت می‌شود. */
.boot{position:fixed;inset:0;z-index:200;display:grid;place-content:center;justify-items:center;
      gap:14px;background:var(--paper);transition:opacity .22s}
.boot.off{opacity:0;pointer-events:none}
.boot .bm{inline-size:52px;block-size:52px;border-radius:15px;background:var(--brand);color:#fff;
          display:grid;place-content:center;font-size:25px;font-weight:800}
:root[data-theme="dark"] .boot .bm{color:#07111F}
.boot .bt{font-size:14px;color:var(--ink-3)}
.boot .bs{inline-size:120px;block-size:3px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.boot .bs i{display:block;block-size:100%;inline-size:40%;border-radius:3px;background:var(--brand);
            animation:bootslide 1.1s ease-in-out infinite}
@keyframes bootslide{0%{transform:translateX(150%)}100%{transform:translateX(-250%)}}

/* در حالت واقعی، نوار نمایشی و کلید تعویض نقش معنایی ندارند */
#root.is-live .demo-bar{display:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>


<div class="lt" id="root" dir="rtl" lang="fa">

<div class="boot" id="boot">
  <div class="bm">ت</div>
  <div class="bt">تاکورا در حال آماده‌سازی…</div>
  <div class="bs"><i></i></div>
</div>

<div class="demo-bar">
  <span><b>نسخهٔ نمایشی:</b> داده‌ها واقعی نیستند و ذخیره نمی‌شوند. نقش را عوض کنید:</span>
  <button class="btn btn--q btn--sm" data-nav="auth">دیدن صفحهٔ ثبت‌نام</button>
  <div class="role-sw" id="roleSw" role="group" aria-label="تغییر نقش">
    <button data-role="teacher">مدرس</button>
    <button data-role="student">زبان‌آموز</button>
    <button data-role="manager">مدیر</button>
  </div>
</div>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="brand-mark">ت</span><span>تاکورا</span></div>
    <div class="side-scroll"><nav id="nav" aria-label="منوی اصلی"></nav></div>
    <div class="side-foot">
      <button class="me" id="meBtn"></button>
      <button class="me" data-act="logout" style="font-size:13px;color:var(--ink-3)">
        <span class="av" style="background:transparent">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
        </span><span class="nm"><b style="font-weight:400">خروج از حساب</b></span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="ib burg" id="burg" aria-label="منو">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="pageTitle">پیشخوان</h1>
      <div class="top-r">
        <button class="ib" id="themeBtn" aria-label="حالت روشن و تاریک">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="ib" aria-label="اعلان‌ها">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="full" id="full"></div>
<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</div>


<script>
(function(){
"use strict";

try{ document.documentElement.setAttribute("dir","rtl");
     document.documentElement.setAttribute("lang","fa");
     document.body.classList.add("lt"); }catch(e){}

/* ══════════ کمکی‌ها ══════════ */
var FA=["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function fa(n){return String(n).replace(/[0-9]/g,function(d){return FA[+d];});}
function faG(n){return fa(String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"٬"));}
function money(n){return faG(n)+" تومان";}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function h(strings){var out=strings[0];
  for(var i=1;i<arguments.length;i++){out+=arguments[i]+strings[i];} return out;}
function enDigits(s){  /* ارقام فارسی و عربی را به لاتین برمی‌گرداند تا اعتبارسنجی کار کند */
  return String(s)
    .replace(/[۰-۹]/g,function(d){return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d));})

}

/* ══════════ تقویم شمسی ══════════
   سرور همه‌چیز را میلادی ISO می‌دهد و UTC ذخیره می‌کند؛ تبدیل اینجا
   انجام می‌شود — بند P.2. تاریخ شمسی شهروند درجه‌یک است، نه فیلتر
   نمایشی: برنامهٔ ترم، سررسید تکلیف و کارنامه همه با همین ساخته می‌شوند. */
var J_MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",
              "مهر","آبان","آذر","دی","بهمن","اسفند"];
var J_DAYS=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];

function toJalali(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy<=1600)?0:979;
  gy-=(gy<=1600)?621:1600;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+(~~((gy2+3)/4))-(~~((gy2+99)/100))+(~~((gy2+399)/400))-80+gd+gdm[gm-1];
  jy+=33*(~~(days/12053)); days%=12053;
  jy+=4*(~~(days/1461));   days%=1461;
  if(days>365){jy+=~~((days-1)/365); days=(days-1)%365;}
  var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}

/** "2026-07-30" → {y,m,d,dow} یا null */
function parseISO(s){
  if(!s)return null;
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return null;
  var j=toJalali(+m[1],+m[2],+m[3]);
  return {y:j[0],m:j[1],d:j[2],dow:new Date(+m[1],+m[2]-1,+m[3]).getDay(),iso:String(s).slice(0,10)};
}

/** «۸ مرداد» — شکل کوتاه که همه‌جای پنل استفاده می‌شود */
function jDate(iso){var j=parseISO(iso); return j?fa(j.d)+" "+J_MONTHS[j.m-1]:"—";}
/** «۸ مرداد ۱۴۰۵» */
function jFull(iso){var j=parseISO(iso); return j?fa(j.d)+" "+J_MONTHS[j.m-1]+" "+fa(j.y):"—";}
/** «شنبه ۸ مرداد» */
function jDay(iso){var j=parseISO(iso); return j?J_DAYS[j.dow]+" "+fa(j.d)+" "+J_MONTHS[j.m-1]:"—";}

/** "2026-07-30 18:30:00" → «۸ مرداد، ۱۸:۳۰» */
function jDateTime(s){
  if(!s)return "—";
  var t=String(s).match(/(\d{2}):(\d{2})/);
  return jDate(s)+(t?"، "+fa(t[1]+":"+t[2]):"");
}

/** امروز به میلادی ISO، برای فرستادن به سرور */
function todayISO(){var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

/** اختلاف روز تا یک تاریخ؛ مثبت یعنی هنوز نرسیده */
function daysUntil(iso){
  if(!iso)return null;
  var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return null;
  var t=new Date(+m[1],+m[2]-1,+m[3]).setHours(0,0,0,0);
  return Math.round((t-new Date().setHours(0,0,0,0))/86400000);
}

/** «۴ روز مانده» / «۳ روز گذشته» */
function dueLabel(iso){
  var n=daysUntil(iso);
  if(n===null)return "بدون مهلت";
  if(n===0)return "امروز";
  if(n===1)return "فردا";
  return n>0?fa(n)+" روز مانده":fa(-n)+" روز گذشته";
}
function clock(sec){return fa(pad(Math.floor(sec/60))+":"+pad(sec%60));}

function toast(msg,undo){
  var t=document.createElement("div");
  t.className="toast";
  t.innerHTML='<span>'+msg+'</span>'+(undo?'<button class="u">برگرداندن</button>':'');
  el("toasts").appendChild(t);
  var kill=setTimeout(function(){t.remove();},4200);
  if(undo){t.querySelector(".u").addEventListener("click",function(){
    clearTimeout(kill); t.remove(); undo();});}
}

var API={base:"api/",live:false,bridge:false,user:null};

function apiCall(path,body){
  var opt={credentials:"same-origin",headers:{Accept:"application/json"}};
  if(body){
    opt.method="POST";
    opt.headers["Content-Type"]="application/json";
    opt.body=JSON.stringify(body);
  }
  return fetch(API.base+path,opt).then(function(r){
    return r.json().then(function(j){return j;},function(){
      return {ok:false,error:"bad_response",message:"پاسخ سرور قابل خواندن نبود."};
    });
  },function(){
    return {ok:false,error:"offline",message:"ارتباط با سرور برقرار نشد."};
  });
}

/* درخواست با مهلت: روی هاست کند کاربر نباید پشت صفحهٔ آماده‌سازی بماند */
function withTimeout(p,ms){
  return new Promise(function(res){
    var done=false;
    var t=setTimeout(function(){if(!done){done=true;res(null);}},ms);
    function settle(v){if(!done){done=true;clearTimeout(t);res(v);}}
    p.then(settle,function(){settle(null);});
  });
}

/** بعد از هر تغییر، داده را دوباره می‌گیریم — نه اینکه حدس بزنیم چه شد */
function reload(then){
  return apiCall("bootstrap.php").then(function(r){
    if(r&&r.ok){applyBootstrap(r);render();}
    else if(r&&r.error==="no_institute"){API.noWorkspace=true;render();}
    if(then)then(r);
    return r;
  });
}

/** فراخوانی با نمایش خطا و تازه‌سازی خودکار */
function act(file,body,okMsg,then){
  if(S.busy)return Promise.resolve();
  S.busy=true;
  return apiCall(file,body).then(function(r){
    S.busy=false;
    if(!r||!r.ok){toast(r&&r.message?r.message:"انجام نشد");return r;}
    return reload(function(){ if(okMsg)toast(okMsg); if(then)then(r); }).then(function(){return r;});
  });
}

function applyUser(u){
  API.user=u;
  var r=roleRoute(u.role);
  S.role=r==="m"?"manager":r==="s"?"student":"teacher";
  DB.me[S.role]={name:u.name||"کاربر",role:ROLE_FA[u.role]||"کاربر"};
  if(u.institute)DB.institute.name=u.institute;
}

/** جلسه‌های امروز از دادهٔ bootstrap */
function todaySessions(){
  var t=API.data?API.data.serverDate:todayISO();
  return (DB.sessions||[]).filter(function(x){return x.date===t&&x.status!=="cancelled";})
    .sort(function(a,b){return a.time<b.time?-1:1;});
}
function nextSessions(n){
  var t=API.data?API.data.serverDate:todayISO();
  /* جلسهٔ زنده هم باید بماند. اگر فقط scheduled را می‌گرفتیم، مدرسی که
     جلسه‌ای جلوتر از امروز را شروع می‌کرد آن را از هر دو فهرست گم می‌کرد
     و راهی برای ثبت حضور یا بستنش نداشت. */
  return (DB.sessions||[]).filter(function(x){
      return x.date>=t&&(x.status==="scheduled"||x.status==="live");})
    .sort(function(a,b){
      if(a.status!==b.status)return a.status==="live"?-1:1;   // زنده اول
      return (a.date+a.time)<(b.date+b.time)?-1:1;})
    .slice(0,n||5);
}
function sessionCard(x,who){
  var c=cls(x.cls)||{name:"کلاس"};
  var live=x.status==="live";
  return h`<div class="asg">
    <span class="ic">${icon(live?"video":"cal",19)}</span>
    <span class="tx"><b>${esc(c.name)}</b>

  var mySubs=DB.submissions||[];

/* ══════════ ورود و ثبت‌نام ══════════ */

function authErr(msg){S.auth.err=msg;S.auth.busy=false;render();}

function stopCooldown(){
  if(S.auth.tick){clearInterval(S.auth.tick);S.auth.tick=null;}
  S.auth.cool=0;
}
function startCooldown(sec){
  stopCooldown();
  S.auth.cool=sec|0;
  S.auth.tick=setInterval(function(){
    S.auth.cool--;
    if(S.auth.cool<=0){stopCooldown();if(S.route==="auth")render();return;}
    /* فقط عدد را عوض می‌کنیم؛ render کامل تمرکز را از خانه‌های کد می‌گیرد */
    var n=el("auCool");
    if(n)n.textContent=fa(S.auth.cool)+" ثانیه تا ارسال دوباره";
  },1000);
}

/*
 * تأیید کد. اگر سرور بگوید کاربر تازه است و نامش را ندارد، همان کد را
 * نگه می‌داریم و در گام سه دوباره با نام می‌فرستیم — سرور کد را تا آن
 * لحظه نمی‌سوزاند، پس ثبت‌نام نیمه‌کاره نمی‌ماند.
 */
function verifyOtp(){
  apiCall("otp-verify.php",{
    phone:S.auth.phone, code:S.auth.code,
    fullName:S.auth.name, instituteName:S.auth.inst
  }).then(function(r){
    S.auth.busy=false;
    if(r.ok&&r.needsProfile){S.auth.step=3;S.auth.err="";render();return;}
    if(!r.ok){
      if(r.error==="expired"||r.error==="too_many_attempts"){
        S.auth.step=1; stopCooldown();
      }
      authErr(r.attemptsLeft!=null&&r.attemptsLeft>0
        ? (r.message||"کد اشتباه است.")+" "+fa(r.attemptsLeft)+" تلاش دیگر دارید."
        : (r.message||"کد پذیرفته نشد."));
      return;
    }
    stopCooldown();
    applyUser(r.user);
    S.auth.code=""; S.auth.err="";

    /*
     * دادهٔ واقعی را *قبل* از رفتن به داشبورد می‌گیریم.
     * وگرنه کاربر تازه‌وارد لحظه‌ای دادهٔ نمونه می‌دید — کلاس‌ها و
     * زبان‌آموزهایی که مال او نیستند — تا اولین رفرش. آن یک لحظه
     * بدترین چیزی است که می‌شد نشان داد.
     */
    reload(function(b){
      if(b&&!b.ok&&b.error==="no_institute"){ API.noWorkspace=true; go("nows"); render(); return; }
      go(roleRoute(r.user.role));
      render();
      toast(r.isNew?"خوش آمدید، حساب شما ساخته شد":"خوش آمدید، "+r.user.name);
    });
  });
}

function termConflicts(){
  var rows=S.term.rows||DB.termDraft, out=[];
  rows.forEach(function(r,i){
    if(!r.teacher){out.push({row:r.id,k:"unassigned",t:"کلاس «"+r.course+"» مدرس ندارد"});}
    rows.forEach(function(o,j){
      if(j<=i)return;
      if(r.day===o.day&&r.time===o.time){
        if(r.teacher&&r.teacher===o.teacher){
          var tn=(DB.teachers.filter(function(x){return x.id===r.teacher;})[0]||{}).name;
          out.push({row:r.id,k:"teacher",t:tn+" هم‌زمان در «"+r.course+"» و «"+o.course+"» است"});
        }
        if(r.room===o.room){
          var rn=(DB.rooms.filter(function(x){return x.id===r.room;})[0]||{}).name;
          out.push({row:r.id,k:"room",t:rn+" هم‌زمان به «"+r.course+"» و «"+o.course+"» داده شده"});
        }
      }
    });
    var rm=DB.rooms.filter(function(x){return x.id===r.room;})[0];
    if(rm&&r.cap>rm.cap){out.push({row:r.id,k:"cap",
      t:"ظرفیت «"+r.course+"» ("+fa(r.cap)+") از ظرفیت "+rm.name+" ("+fa(rm.cap)+") بیشتر است"});}
  });
  return out;
}

    var pct=Math.round(right/E.qs.length*100);

    return h`

        <div style="display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:100px;
          background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:16px">

        <p class="muted" style="font-size:13.5px;margin-top:18px;line-height:1.95">
          این سطح روی پروندهٔ شما ثبت شد و کلاس‌های باز همین سطح را می‌بینید.
          تعیین سطح نهایی با مصاحبهٔ کوتاه مدرس تأیید می‌شود.</p>
        <div style="display:flex;gap:9px;justify-content:center;margin-top:20px;flex-wrap:wrap">
          <button class="btn btn--p" data-nav="s">دیدن کلاس‌های این سطح</button>
          <button class="btn btn--g" data-act="ex-review">مرور پاسخ‌ها</button>
        </div>
      </div>
    </div>`;
  }
  var q=E.qs[ex.i];
  var low=ex.left<60;
  return h`
  <div class="gbar">
    <span class="pill p-mute num">سوال ${fa(ex.i+1)} از ${fa(E.qs.length)}</span>

function readClass(){
  function v(id){var e=el(id);return e?e.value:"";}
  return {
    name:v("clName").trim(), level:v("clLevel").trim(), teacherId:v("clTeacher"),
    dayPattern:v("clDay"), time:enDigits(v("clTime")).trim(),
    cap:+enDigits(v("clCap"))||12, totalSessions:+enDigits(v("clTotal"))||20,

/* ══════════ ضبط صدا (شبیه‌سازی) ══════════ */
function recTick(){
  S.rec.sec++;
  var t=el("recTime"); if(t)t.textContent=clock(S.rec.sec);
  var w=el("wave");
  if(w){Array.prototype.forEach.call(w.children,function(b,i){
    var v=6+Math.abs(Math.sin((S.rec.sec*1.7+i*0.55)))*26;
    b.style.height=v.toFixed(0)+"px";});}
  if(S.rec.sec>=120)stopRec();
}
function stopRec(){
  clearInterval(S.rec.timer); S.rec.timer=null; S.rec.on=false; S.rec.done=true;
  var b=el("recBtn"); if(b)b.classList.remove("on");
  var hnt=el("recHint"); if(hnt)hnt.textContent="ضبط شد. می‌توانید گوش کنید یا دوباره ضبط کنید.";
  var s=el("sendAudio"); if(s)s.disabled=false;
  var w=el("wave"); if(w){Array.prototype.forEach.call(w.children,function(b2,i){
    b2.style.height=(6+Math.abs(Math.sin(i*0.9))*22).toFixed(0)+"px";});}
}
function toggleRec(){
  if(S.rec.on){stopRec();return;}
  S.rec.on=true; S.rec.sec=0; S.rec.done=false;
  el("recBtn").classList.add("on");
  el("recHint").textContent="در حال ضبط… برای پایان دوباره بزنید";
  el("sendAudio").disabled=true;
  S.rec.timer=setInterval(recTick,1000);
}
function wordCount(){
  var t=el("subText"); if(!t)return;
  var n=t.value.trim()?t.value.trim().split(/\s+/).length:0;
  var wc=el("wc"); if(wc)wc.textContent=fa(n);
  var b=el("sendText"); if(b)b.disabled=n<20;
  S.subDraft=t.value;
}

 "t/assignments":"تکالیف","t/grading":"صف تصحیح","t/gradebook":"دفتر نمره",
 "t/schedule":"برنامهٔ هفتگی","t/materials":"فایل‌ها","t/tools":"ابزار حین کلاس",
 "t/payroll":"کارکرد و حقوق من",
 "s":"خانه","s/classes":"کلاس‌های من","s/assignments":"تکالیف","s/grades":"نمرات و پیشرفت",
 "s/payments":"شهریه و اقساط","s/schedule":"برنامهٔ کلاسی","s/certificates":"مدارک",
 "s/exams":"آزمون‌ها","s/exam":"آزمون در حال برگزاری",

/* مسیرهایی که تمام‌صفحه‌اند و پوستهٔ اپ را نشان نمی‌دهند */
var FULL={"auth":1,"nows":1};

function go(route){location.hash="#/"+route;}
function render(){
  /*
   * #/signup یک مسیر واقعی نیست، یک میان‌بر است: همان صفحهٔ ورود را باز
   * می‌کند ولی روی حالت «ثبت‌نام آموزشگاه». دکمهٔ ثبت‌نام سایت به اینجا
   * می‌آید، وگرنه کاربر روی صفحهٔ ورود می‌افتاد و باید خودش دنبال لینک
   * کوچک «ثبت‌نام» می‌گشت.
   */
  if(/^#\/?signup/.test(location.hash||"")){
    S.auth.newInst=true;
    location.replace("#/auth");
    return;
  }
  var r=(location.hash||"#/t").replace(/^#\/?/,"")||"t";
  if(!V[r]){r=S.role==="student"?"s":S.role==="manager"?"m":"t";}

  /*
   * نگهبان مسیر در حالت واقعی: نقش از سرور می‌آید، نه از آدرس.
   * وگرنه یک زبان‌آموز با تایپ #/m داشبورد مدیر را باز می‌کرد.
   * این جایگزین بررسی سمت سرور نیست؛ فقط جلوی رفتن به جای اشتباه را می‌گیرد.
   */
  if(API.live){
    if(!API.user){ r="auth"; }
    else if(API.noWorkspace){ r="nows"; }
    else if(r==="auth"||r==="nows"){ r=roleRoute(API.user.role); }
    else if(r.split("/")[0]!==roleRoute(API.user.role)){ r=roleRoute(API.user.role); }
    if("#/"+r!==location.hash){ location.replace("#/"+r); }
  }

  if(FULL[r]){
    document.body.classList.add("full-mode");
    el("full").classList.add("on");
    el("full").innerHTML=V[r]();
    S.route=r; window.scrollTo(0,0);
    var f=el("full").querySelector("input"); if(f)f.focus();
    return;
  }
  document.body.classList.remove("full-mode");
  el("full").classList.remove("on"); el("full").innerHTML="";

  var first=r.split("/")[0];
  S.role=first==="s"?"student":first==="m"?"manager":"teacher";
  S.route=r;
  el("pageTitle").textContent=TITLES[r]||"تاکورا";
  el("page").innerHTML=V[r]();
  renderNav();
  el("side").classList.remove("open"); el("scrim").classList.remove("on");
  if(r==="s/exam"&&S.exam.on&&!S.exam.timer){startExamTimer();}
  if(r!=="s/exam"&&S.exam.timer){clearInterval(S.exam.timer);S.exam.timer=null;}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ── تایمر آزمون ── */
function startExamTimer(){
  S.exam.timer=setInterval(function(){
    S.exam.left--;
    var t=el("exTime");
    if(t){t.textContent=clock(Math.max(0,S.exam.left));
      t.classList.toggle("low",S.exam.left<60);}
    if(S.exam.left<=0){clearInterval(S.exam.timer);S.exam.timer=null;
      S.exam.done=true;S.exam.on=false;
      toast("زمان آزمون تمام شد و پاسخ‌ها خودکار ثبت شدند");render();}
  },1000);
}

/* ── تایمر ابزار کلاس ── */
function tickTool(){
  S.tools.timer--;
  var d=el("tmDisp"); if(d)d.textContent=clock(Math.max(0,S.tools.timer));
  if(S.tools.timer<=0){clearInterval(S.tools.tk);S.tools.tk=null;S.tools.run=false;
    toast("وقت تمام شد");render();}
}

/* ══════════ رویدادها ══════════ */
document.addEventListener("click",function(e){
  var t=e.target;

  var navBtn=t.closest("[data-nav]");
  if(navBtn){e.preventDefault();go(navBtn.dataset.nav);return;}

  var roleBtn=t.closest("#roleSw button");
  if(roleBtn){var r=roleBtn.dataset.role;
    go(r==="student"?"s":r==="manager"?"m":"t");return;}

  /* حضور و غیاب */
  var segBtn=t.closest(".seg button");
  /*
   * فقط ردیف‌های حضورِ نمایشی (.rrow). مودال حضور واقعی هم دکمه‌های .seg
   * دارد ولی داخل .att-row است و کنترل‌کنندهٔ [data-att] رسیدگی‌اش می‌کند.
   * بدون این شرط، کلیک در مودال واقعی اینجا می‌افتاد و روی null می‌شکست.
   */
  if(segBtn&&segBtn.closest(".rrow")){
    var row=segBtn.closest(".rrow"), sid=row.dataset.sid, v=segBtn.dataset.v;
    S.att[sid]=v;
    Array.prototype.forEach.call(segBtn.parentNode.children,function(b){
      b.classList.toggle("on",b===segBtn);});
    row.dataset.st=(v==="absent")?"absent":"";
    var c=countAtt();
    if(el("cOk"))el("cOk").textContent=fa(c.p)+" حاضر";
    if(el("cLate"))el("cLate").textContent=fa(c.l)+" تأخیر";
    if(el("cNo"))el("cNo").textContent=fa(c.a)+" غایب";
    return;
  }

  /* روبریک */
  var scaleBtn=t.closest(".scale button");
  if(scaleBtn){
    var crit=scaleBtn.closest(".scale").dataset.crit;
    var subs=DB.submissions.filter(function(x){return x.aid==="a1";});
    var sid2=subs[Math.min(S.grade.idx,subs.length-1)].sid;
    S.grade.scores[sid2]=S.grade.scores[sid2]||{};
    S.grade.scores[sid2][crit]=+scaleBtn.dataset.n;
    Array.prototype.forEach.call(scaleBtn.parentNode.children,function(b){
      b.classList.toggle("on",b===scaleBtn);});
    var tot=rubTotal(sid2);
    el("rubTotal").innerHTML=tot==null?'<i class="dash"></i>':fa(tot)+" از ۲۰";
    return;
  }

  var phraseBtn=t.closest(".phrase");
  if(phraseBtn){
    var fb=el("fb");
    fb.value=(fb.value?fb.value.replace(/\s*$/,"")+" ":"")+phraseBtn.dataset.phrase+".";
    fb.focus(); return;
  }

  /* ارائه‌دهنده */
  var provBtn=t.closest("[data-prov]");
  if(provBtn){
    S.provider=provBtn.dataset.prov;
    Array.prototype.forEach.call(provBtn.parentNode.children,function(b){
      b.setAttribute("aria-checked",b===provBtn?"true":"false");});
    return;
  }
  var sw=t.closest(".sw");
  if(sw){sw.setAttribute("aria-checked",sw.getAttribute("aria-checked")==="true"?"false":"true");return;}

  /* انتخاب سطح در ثبت‌نام */
  var lvlBtn=t.closest("[data-lvl]");
  if(lvlBtn){S.enrol.level=lvlBtn.dataset.lvl;render();return;}
  var planBtn=t.closest("[data-plan]");
  if(planBtn){S.enrol.plan=planBtn.dataset.plan;render();return;}
  var clsPick=t.closest("[data-cls-pick]");
  if(clsPick){S.enrol.clsId=clsPick.dataset.clsPick;render();return;}

  /* گزینهٔ آزمون */
  var optBtn=t.closest("[data-opt]");
  if(optBtn&&optBtn.classList.contains("opt")){
    S.exam.ans[S.exam.i]=+optBtn.dataset.opt;
    Array.prototype.forEach.call(optBtn.parentNode.querySelectorAll(".opt"),function(b){
      b.setAttribute("aria-checked",b===optBtn?"true":"false");});
    var qn=document.querySelector('[data-goq="'+S.exam.i+'"]');
    if(qn)qn.classList.add("ans");
    return;
  }
  var goq=t.closest("[data-goq]");
  if(goq){S.exam.i=+goq.dataset.goq;render();return;}

  /* ویرایش ردیف ترم‌ساز */
  var act=t.closest("[data-act]");
  if(!act)return;
  var a=act.dataset.act;

  /* ── ورود و ثبت‌نام ── */
  if(a==="au-toggle"){S.auth.newInst=!S.auth.newInst;S.auth.err="";render();}
  else if(a==="au-send"||a==="au-resend"){
    if(S.auth.busy)return;
    var ph=a==="au-resend"?S.auth.phone
                          :enDigits((el("auPhone")||{}).value||"").replace(/\s/g,"");
    if(!/^09\d{9}$/.test(ph)){authErr("شمارهٔ موبایل باید ۱۱ رقم و با ۰۹ شروع شود.");return;}
    if(a==="au-send"&&S.auth.newInst){
      var nv=((el("auName")||{}).value||"").trim(), iv=((el("auInst")||{}).value||"").trim();
      if(!nv){authErr("نام و نام خانوادگی را وارد کنید.");return;}
      if(!iv){authErr("نام آموزشگاه را وارد کنید.");return;}
      S.auth.name=nv; S.auth.inst=iv;
    }
    S.auth.phone=ph; S.auth.err="";
    if(!API.live){
      /* حالت نمایشی: پیامکی در کار نیست */
      S.auth.step=2; startCooldown(60); render();
      toast(a==="au-resend"?"کد دوباره ارسال شد":"کد به "+fa(ph)+" پیامک شد");
      return;
    }
    S.auth.busy=true; render();
    apiCall("otp-request.php",{phone:ph}).then(function(r){
      S.auth.busy=false;
      if(!r.ok){
        /* «کمی صبر کنید» خطا نیست، فقط فاصلهٔ ارسال است — کاربر را به عقب برنگردانیم */
        if(r.error==="cooldown"){S.auth.step=2;startCooldown(r.retryAfter||60);render();return;}
        authErr(r.message||"ارسال کد ممکن نشد."); return;
      }
      /* در حالت پل پیامکی نرفته؛ گفتن «پیامک شد» یعنی کاربر منتظر
         چیزی می‌ماند که هرگز نمی‌آید. */
      S.auth.bridge=!!r.bridge; S.auth.expires=r.expiresIn||300;
      S.auth.step=2; startCooldown(r.resendAfter||60); render();
      toast(r.bridge?"کد ساخته شد؛ از مدیر آموزشگاه بگیرید":"کد به "+fa(ph)+" پیامک شد");
    });
  }
  else if(a==="au-back"){S.auth.step=1;S.auth.err="";stopCooldown();render();}
  else if(a==="au-verify"){
    if(S.auth.busy)return;
    var box=el("otpBox"), code="";
    if(box)Array.prototype.forEach.call(box.querySelectorAll("input"),function(x){code+=x.value;});
    code=enDigits(code).replace(/\D/g,"");
    if(code.length!==5){authErr("هر پنج رقم کد را وارد کنید.");return;}
    if(!API.live){
      if(S.auth.newInst){S.auth.step=3;S.auth.err="";render();}
      else{stopCooldown();go("m");toast("خوش آمدید");}
      return;
    }
    S.auth.code=code; S.auth.err=""; S.auth.busy=true; render();
    verifyOtp();
  }
  else if(a==="au-profile"){
    if(S.auth.busy)return;
    var pn=((el("auName2")||{}).value||"").trim();
    if(!pn){authErr("نام‌تان را وارد کنید.");return;}
    S.auth.name=pn; S.auth.inst=((el("auInst2")||{}).value||"").trim();
    S.auth.err=""; S.auth.busy=true; render();
    verifyOtp();
  }
  else if(a==="nw-create"){
    var nwi=((el("nwInst")||{}).value||"").trim();
    if(!nwi){S.auth.err="نام آموزشگاه را وارد کنید.";render();return;}
    S.auth.err="";
    apiCall("workspace.php",{action:"create",name:nwi}).then(function(r){
      if(!r.ok){S.auth.err=r.message||"ساخته نشد.";render();return;}
      API.noWorkspace=false;
      applyUser({name:(API.user&&API.user.name)||nwi,role:"manager",institute:nwi});
      reload(function(){go("m");toast("آموزشگاه «"+nwi+"» ساخته شد");});
    });
  }
  else if(a==="au-finish"){
    if(S.auth.inst)DB.institute.name=S.auth.inst;
    S.onboard.profile=true; S.onboard.levels=true;
    go("m"); toast("فضای کاری «"+DB.institute.name+"» ساخته شد");
  }
  else if(a==="logout"){
    stopCooldown();
    S.auth={step:1,phone:"",inst:"",name:"",code:"",err:"",busy:false,cool:0,tick:null,newInst:false};
    if(API.live){apiCall("logout.php",{}).then(function(){API.user=null;go("auth");render();});}
    else go("auth");
  }

  /* ── ترم‌ساز ── */
  else if(a==="tm-step"){S.term.step=+act.dataset.n;render();}
  else if(a==="tm-del"){
    var id=+act.dataset.id;
    S.term.rows=S.term.rows.filter(function(r){return r.id!==id;});
    render(); toast("کلاس حذف شد");
  }
  else if(a==="tm-add"){
    var nid=Math.max.apply(null,S.term.rows.map(function(r){return r.id;}))+1;
    S.term.rows.push({id:nid,course:"دورهٔ جدید",level:"",day:"فرد",time:"۱۸:۰۰",
                      teacher:"",room:"r1",cap:14,price:13500000});
    render();
  }
  else if(a==="tm-publish"){
    toast("ترم منتشر شد؛ "+fa(S.term.rows.length*20)+" جلسه ساخته شد و کمپین تمدید اجرا شد");
    S.onboard.term=true; go("m");
  }

  /* ── ثبت‌نام زبان‌آموز ── */
  else if(a==="en-step"){
    var n=+act.dataset.n;
    if(n===2&&S.enrol.step===1){
      var nm=(el("enName")||{}).value||"", pp=enDigits((el("enPhone")||{}).value||"");
      if(!nm.trim()){toast("نام زبان‌آموز را وارد کنید");return;}
      if(!/^09\d{9}$/.test(pp)){toast("شمارهٔ موبایل معتبر نیست");return;}
      S.enrol.name=nm; S.enrol.phone=pp;
    }
    if(n===3&&!S.enrol.level){toast("روش تعیین سطح را انتخاب کنید");return;}
    if(n===4&&!S.enrol.clsId){toast("یک کلاس انتخاب کنید");return;}
    S.enrol.step=n; render();
  }
  else if(a==="en-pay"){
    var who=S.enrol.name||"زبان‌آموز";
    toast("ثبت‌نام "+esc(who)+" کامل شد؛ رسید و برنامهٔ کلاسی پیامک شد");
    S.enrol={step:1,name:"",phone:"",level:"",clsId:"",plan:"instal",paid:false};
    go("m/students");
  }
  else if(a==="go-exam"){go("s/exams");}

  /* ── آزمون ── */
  else if(a==="ex-start"){
    S.exam={on:true,i:0,ans:{},left:DB.exam.minutes*60,timer:null,done:false};
    go("s/exam");
  }
  else if(a==="ex-next"){if(S.exam.i<DB.exam.qs.length-1){S.exam.i++;render();}}
  else if(a==="ex-prev"){if(S.exam.i>0){S.exam.i--;render();}}
  else if(a==="ex-submit"){
    var un=DB.exam.qs.length-Object.keys(S.exam.ans).length;
    if(un>0&&!act.dataset.sure){
      act.dataset.sure="1"; toast(fa(un)+" سوال بی‌پاسخ است. دوباره بزنید تا ثبت شود.");return;}
    if(S.exam.timer){clearInterval(S.exam.timer);S.exam.timer=null;}
    S.exam.done=true;S.exam.on=false;render();
  }
  else if(a==="ex-review"){toast("مرور پاسخ‌ها در نسخهٔ کامل، هر سوال را با پاسخ درست نشان می‌دهد.");}

  /* ── ابزار حین کلاس ── */
  else if(a==="tl-set"){S.tools.timer=+act.dataset.s;S.tools.started=true;
    if(S.tools.tk){clearInterval(S.tools.tk);S.tools.tk=null;S.tools.run=false;}render();}
  else if(a==="tl-toggle"){
    if(S.tools.run){clearInterval(S.tools.tk);S.tools.tk=null;S.tools.run=false;}
    else{if(S.tools.timer<=0){toast("اول یک مدت انتخاب کنید");return;}
      S.tools.run=true;S.tools.started=true;S.tools.tk=setInterval(tickTool,1000);}
    render();
  }
  else if(a==="tl-pick"){
    var pool=DB.students.filter(function(s){return (S.tools.used||[]).indexOf(s.id)<0;});
    if(!pool.length){toast("همه یک‌بار انتخاب شدند. دور جدید را شروع کنید.");return;}
    var pick=pool[Math.floor(Math.random()*pool.length)];
    S.tools.used=(S.tools.used||[]).concat([pick.id]);
    S.tools.picked=pick.name; render();
  }
  else if(a==="tl-reset"){S.tools.used=[];S.tools.picked="";render();toast("دور جدید شروع شد");}
  else if(a==="tl-poll"){
    S.tools.poll=[0,0,0]; render();
    toast("نظرسنجی برای ۸ نفر ارسال شد");
    var n=0, iv=setInterval(function(){
      if(!S.tools.poll||n>=8){clearInterval(iv);return;}
      S.tools.poll[Math.floor(Math.random()*3)]++; n++;
      if(S.route==="t/tools")render();
    },700);
  }
  else if(a==="tl-poll-end"){S.tools.poll=null;render();toast("نظرسنجی بسته شد");}

  else if(a==="close"){closeModal();}
  else if(a==="start-class"){modalStartClass(act.dataset.cls);}
  else if(a==="do-start"){
    var rec=el("modal").querySelector('[data-opt="record"]').getAttribute("aria-checked")==="true";
    S.live={classId:act.dataset.cls,provider:S.provider,record:rec,joined:1};
    closeModal();
    toast("کلاس روی "+providerName(S.provider)+" شروع شد");
    var c2=cls(S.live.classId);
    setTimeout(function(){ if(S.live){S.live.joined=Math.min(c2.enrolled,11); render();
      toast("زبان‌آموزها در حال ورودند، "+fa(S.live.joined)+" نفر داخل کلاس");}},1400);
    render();
  }
  else if(a==="open-room"){modalRoom();}
  else if(a==="end-class"){
    var prov=S.live.provider; S.live=null; closeModal(); render();
    if(prov==="meet"){toast("کلاس پایان یافت. حضور و غیاب را دستی ثبت کنید.");}
    else{toast("کلاس پایان یافت. حضور و غیاب خودکار آماده است."); }
  }
  else if(a==="join-class"){
    if(S.live)S.live.joined++;
    toast("وارد کلاس شدید. حضورتان خودکار ثبت می‌شود.");
    render();
  }
  else if(a==="all-present"){
    DB.students.forEach(function(s){S.att[s.id]="present";});
    el("roster").innerHTML=rosterRows();
    var cc=countAtt();
    el("cOk").textContent=fa(cc.p)+" حاضر"; el("cLate").textContent=fa(cc.l)+" تأخیر";
    el("cNo").textContent=fa(cc.a)+" غایب";
  }
  else if(a==="cancel-session"){
    toast("جلسه لغو شد. همه «نامربوط» ثبت شدند و به زبان‌آموزها پیامک رفت.");
    go("t");
  }
  else if(a==="submit-att"){
    var cnt=countAtt();
    var msg=cnt.a>0?"ثبت شد؛ به "+fa(cnt.a)+" زبان‌آموز پیامک غیبت رفت"
                   :"ثبت شد؛ همه حاضر بودند";
    var snap=JSON.parse(JSON.stringify(S.att));
    toast(msg,function(){S.att=snap;toast("ثبت برگردانده شد");});
    go("t");
  }
  else if(a==="open-sub"){modalSubmit(act.dataset.aid);}
  else if(a==="send-text"){
    closeModal(); S.subDraft="";
    toast("تکلیف ارسال شد. رسید تحویل برایتان پیامک شد.");
  }
  else if(a==="send-audio"){
    closeModal();
    toast("فایل صوتی ارسال شد ("+clock(S.rec.sec)+")");
  }
  else if(a==="g-next"||a==="g-save"){
    var subsN=DB.submissions.filter(function(x){return x.aid==="a1";});
    if(a==="g-save"){
      var sidS=subsN[S.grade.idx].sid;
      if(rubTotal(sidS)==null){toast("همهٔ معیارهای روبریک را نمره بدهید");return;}
      S.grade.fb[sidS]=el("fb").value;
      toast("نمرهٔ "+esc(stu(sidS).name)+" ثبت شد");
    }
    if(S.grade.idx<subsN.length-1){S.grade.idx++;render();}
    else{toast("همهٔ تکالیف تصحیح شد. برای انتشار نمرات به دفتر نمره بروید.");go("t/gradebook");}
  }
  else if(a==="g-prev"){if(S.grade.idx>0){S.grade.idx--;render();}}
  else if(a==="publish-grades"){toast("نمرات منتشر شد و به زبان‌آموزها اطلاع داده شد.");}
  else if(a==="pay"){toast("در محصول واقعی، اینجا به درگاه پرداخت منتقل می‌شوید.");}
  else if(a==="upload-receipt"){toast("فیش آپلود شد و به صف تأیید مالی رفت.");}
  else if(a==="new-assignment"){toast("فرم ساخت تکلیف بر اساس نوع، در سند R تعریف شده است.");}
  else if(a==="go-teacher"){go("t");}
  else if(a==="ob-do"){
    var k=act.dataset.k;
    if(k==="term"){go("m/term");return;}
    if(k==="students"){go("m/enrol");return;}
    S.onboard[k]=true; render();
    toast(k==="team"?"دعوت‌نامه برای ۴ همکار ارسال شد"
        :k==="money"?"تنظیمات مالی و پنل پیامک ثبت شد":"انجام شد");
  }
  else if(a==="noop"){toast("این بخش در نمونهٔ تعاملی فعال نیست.");}

  /* ══════ کارهای واقعی: کلاس ══════ */
  else if(a==="cl-new"){modalClass("");}
  else if(a==="cl-edit"){modalClass(act.dataset.id);}
  else if(a==="cl-save"){
    var f=readClass();
    if(!f.name){toast("نام کلاس را وارد کنید");return;}
    if(!/^\d{1,2}:\d{2}$/.test(f.time)){toast("ساعت را مثل ۱۸:۰۰ وارد کنید");return;}
    if(f.mode!=="in_person"&&!f.joinUrl&&f.provider!=="bbb"){
      toast("کلاس آنلاین لینک جلسه می‌خواهد");return;}
    var id=act.dataset.id;
    if(id)f.id=id;
    f.action=id?"update":"create";
    closeModal();
    doAct("classes.php",f,id?"کلاس ذخیره شد":"کلاس ساخته شد");
  }
  else if(a==="cl-publish"){
    doAct("classes.php",{action:"publish",id:act.dataset.id},null,function(r){
      toast("منتشر شد؛ "+fa(r.sessions)+" جلسه ساخته شد");});
  }
  else if(a==="cl-people"){loadMembers(function(){modalPeople(act.dataset.id);});}
  else if(a==="cl-enrol"){
    var sid=(el("enrPick")||{}).value;
    if(!sid){toast("زبان‌آموز را انتخاب کنید");return;}
    var cid=act.dataset.cls;
    doAct("classes.php",{action:"enrol",classId:cid,studentId:sid},"ثبت‌نام شد",function(){
      modalPeople(cid);});
  }
  else if(a==="cl-withdraw"){
    var cid2=act.dataset.cls;
    doAct("classes.php",{action:"withdraw",classId:cid2,studentId:act.dataset.sid},
          "از کلاس حذف شد",function(){modalPeople(cid2);});
  }

  /* ══════ ترم ══════ */
  else if(a==="tm-setup"){modalTerm();}
  else if(a==="tm-save"){
    var tn=((el("tmName")||{}).value||"").trim();
    if(!tn){toast("نام ترم را وارد کنید");return;}
    var tmStart=(el("tmStart")||{}).value||todayISO();
    var tmWeeks=+enDigits((el("tmWeeks")||{}).value)||12;
    closeModal();
    doAct("institute.php",{action:"setup",termName:tn,termStart:tmStart,weeks:tmWeeks,
      rooms:[{name:"کلاس ۱",cap:12},{name:"کلاس ۲",cap:16}]},"ترم ساخته شد");
  }

  /* ══════ ارسال پاسخ زبان‌آموز ══════ */
  else if(a==="sub-open"){modalAnswer(act.dataset.id);}
  else if(a==="sub-send"){
    var aid=act.dataset.id, txt=((el("ansText")||{}).value||"").trim();
    var fi=el("ansFile"), file=fi&&fi.files&&fi.files[0];
    if(!txt&&!file){toast("متن یا فایل پاسخ را بدهید");return;}
    if(!API.live){toast("در نسخهٔ نمایشی ذخیره نمی‌شود.");return;}
    var fd=new FormData();
    fd.append("action","submit"); fd.append("id",aid); fd.append("text",txt);
    if(file)fd.append("file",file);
    S.busy=true;
    fetch(API.base+"assignments.php",{method:"POST",body:fd,credentials:"same-origin"})
      .then(function(r){return r.json();})
      .then(function(r){
        S.busy=false;
        if(!r.ok){toast(r.message||"ارسال نشد");return;}
        closeModal();
        reload(function(){toast(r.late?"ارسال شد — با تأخیر":"پاسخ ارسال شد");});
      },function(){S.busy=false;toast("ارتباط با سرور برقرار نشد");});
  }

  /* ══════ اعضا و تنظیمات ══════ */
  else if(a==="mem-invite"){loadMembers(function(){modalInvite(act.dataset.role);});}
  else if(a==="mem-send"){
    var nm=((el("ivName")||{}).value||"").trim();
    var ph2=enDigits((el("ivPhone")||{}).value||"").replace(/\s/g,"");
    if(!nm){toast("نام را وارد کنید");return;}
    if(!/^09\d{9}$/.test(ph2)){toast("شمارهٔ موبایل باید ۱۱ رقم و با ۰۹ شروع شود");return;}
    /* همهٔ مقدارها را *قبل* از بستن مودال می‌خوانیم.
       closeModal مودال را خالی می‌کند و بعدش el(...) همیشه null است. */
    var ivCls=(el("ivClass")||{}).value||"";
    closeModal();
    doAct("institute.php",{action:"invite",fullName:nm,phone:ph2,role:act.dataset.role,
                           classId:ivCls},null,function(r){
      toast(r.message||"دعوت ثبت شد"); S.members=null; loadMembers();});
  }
  else if(a==="mem-remove"){
    doAct("institute.php",{action:"removeMember",id:act.dataset.id},"حذف شد",function(){
      S.members=null; loadMembers();});
  }
  else if(a==="st-save"){
    doAct("institute.php",{action:"update",name:((el("stName")||{}).value||"").trim(),
      city:(el("stCity")||{}).value||"",phone:(el("stPhone")||{}).value||""},"ذخیره شد");
  }
  else if(a==="room-new"){modalRoom();}
  else if(a==="room-save"){
    var rn=((el("rmName")||{}).value||"").trim();
    if(!rn){toast("نام را وارد کنید");return;}
    closeModal();
    doAct("institute.php",{action:"addRoom",name:rn,cap:+enDigits((el("rmCap")||{}).value)||12},"افزوده شد");
  }
  else if(a==="room-del"){doAct("institute.php",{action:"deleteRoom",id:act.dataset.id},"حذف شد");}

  /* ══════ جلسه ══════ */
  else if(a==="se-start"){
    doAct("sessions.php",{action:"start",id:act.dataset.id},null,function(r){
      if(r.joinUrl)window.open(r.joinUrl,"_blank","noopener");
      toast(r.attendanceAuto?"کلاس شروع شد؛ حضور خودکار ثبت می‌شود"
                            :"کلاس شروع شد؛ حضور و غیاب را دستی بزنید");
    });
  }
  else if(a==="se-end"){doAct("sessions.php",{action:"end",id:act.dataset.id},"جلسه بسته شد");}
  else if(a==="se-join"){
    apiCall("sessions.php",{action:"join",id:act.dataset.id}).then(function(r){
      if(!r.ok){toast(r.message||"ورود ممکن نشد");return;}
      window.open(r.joinUrl,"_blank","noopener");
    });
  }
  else if(a==="se-att"){openAttendance(act.dataset.id);}
  else if(a==="att-save"){
    var marks=Object.keys(S.attNow||{}).map(function(k){return {id:k,status:S.attNow[k]};});
    doAct("attendance.php",{action:"save",id:act.dataset.id,marks:marks},null,function(r){
      toast("حضور "+fa(r.saved)+" نفر ثبت شد");closeModal();});
  }

  /* ══════ تکلیف ══════ */
  else if(a==="ag-new"){modalAssignment(act.dataset.cls||"");}
  else if(a==="ag-save"){
    var t2=((el("agTitle")||{}).value||"").trim();
    if(!t2){toast("عنوان را وارد کنید");return;}
    var agv={classId:(el("agCls")||{}).value,type:(el("agType")||{}).value,
             desc:(el("agDesc")||{}).value||"",dueDate:(el("agDue")||{}).value||"",
             max:+enDigits((el("agMax")||{}).value)||20};
    closeModal();
    doAct("assignments.php",{action:"create",title:t2,classId:agv.classId,type:agv.type,
      desc:agv.desc,dueDate:agv.dueDate,max:agv.max},"تکلیف ساخته شد");
  }
  else if(a==="ag-close"){doAct("assignments.php",{action:"close",id:act.dataset.id},"بسته شد");}
});

/* ــــ کمکی‌های کار واقعی ــــ */

function doAct(file,body,okMsg,then){
  if(!API.live){toast("این کار در نسخهٔ نمایشی ذخیره نمی‌شود.");return;}
  act(file,body,okMsg,then);
}

function loadMembers(then){
  if(S.members){if(then)then();return;}
  apiCall("institute.php",{action:"members"}).then(function(r){
    if(r&&r.ok)S.members=r;
    if(then)then();
  });
}

function openAttendance(sessionId){
  apiCall("attendance.php",{action:"get",id:sessionId}).then(function(r){
    if(!r.ok){toast(r.message||"باز نشد");return;}
    S.attNow={};
    r.roster.forEach(function(s){S.attNow[s.id]=s.status;});
    S.attSession=r;
    drawAttendance(sessionId);
  });
}

function drawAttendance(sessionId){
  var r=S.attSession, absent=0;
  Object.keys(S.attNow).forEach(function(k){if(S.attNow[k]==="absent")absent++;});
  openModal(h`
    <div class="modal-h"><h3>حضور و غیاب — جلسهٔ ${fa(r.session.seq)}</h3>
      <button class="ib x" data-act="close" aria-label="بستن">✕</button></div>
    <div class="modal-b">
      <p class="muted">${esc(r.className)} · ${jDay(r.session.date)}</p>
      <p style="font-size:13.5px">همه پیش‌فرض حاضرند. فقط غایب‌ها را بزنید.
         ${absent>0?h`<b class="num">${fa(absent)} غایب</b>`:""}</p>
      ${r.roster.length===0?'<div class="empty"><b>کسی در این کلاس ثبت‌نام نیست</b></div>'
      :h`<div>${r.roster.map(function(s){
        var st=S.attNow[s.id];
        return h`<div class="att-row">
          <span class="nm"><b>${esc(s.name)}</b></span>
          <span class="seg" role="group" aria-label="وضعیت ${esc(s.name)}">
            ${[["present","حاضر"],["late","تأخیر"],["absent","غایب"],["excused","موجه"]].map(function(o){
              return '<button class="'+(st===o[0]?"on "+o[0]:"")+'" data-att="'+s.id+'" data-v="'+o[0]+'">'+o[1]+'</button>';
            }).join("")}
          </span></div>`;}).join("")}</div>`}
    </div>
    <div class="modal-f">
      <button class="btn btn--g" data-act="close">انصراف</button>
      <button class="btn btn--p" data-act="att-save" data-id="${sessionId}">ثبت</button>
    </div>`,true);
}

document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-att]");
  if(b){S.attNow[b.dataset.att]=b.dataset.v; drawAttendance(S.attSession.session.id);}
});

document.addEventListener("input",function(e){
  if(e.target.id==="subText"){wordCount();return;}
  /* تاریخ میلادی که کاربر می‌زند، همان‌جا شمسی نشان داده می‌شود */
  if(e.target.id==="agDue"){var n=el("agDueFa"); if(n)n.textContent=jFull(e.target.value);return;}
  if(e.target.id==="tmStart"){var n2=el("tmStartFa"); if(n2)n2.textContent=jFull(e.target.value);return;}

  /* کد یک‌بارمصرف: رقم که خورد، خودکار برو خانهٔ بعد */
  if(e.target.dataset&&e.target.dataset.otp!=null){
    var box=el("otpBox"), inputs=box.querySelectorAll("input");
    e.target.value=enDigits(e.target.value).replace(/\D/g,"").slice(0,1);
    e.target.classList.toggle("filled",!!e.target.value);
    var i=+e.target.dataset.otp;
    if(e.target.value&&i<inputs.length-1)inputs[i+1].focus();
    var all=Array.prototype.every.call(inputs,function(x){return x.value;});
    var v=el("auVerify"); if(v)v.disabled=!all;
    return;
  }

  /* ویرایش ردیف ترم‌ساز → تداخل زنده بازمحاسبه می‌شود */
  var f=e.target.dataset&&e.target.dataset.f;
  if(f&&e.target.dataset.id){
    var id=+e.target.dataset.id;
    S.term.rows.forEach(function(r){
      if(r.id===id)r[f]=(f==="cap")?(+e.target.value||0):e.target.value;});
    render();
    var again=document.querySelector('[data-f="'+f+'"][data-id="'+id+'"]');
    if(again)again.focus();
  }
});
document.addEventListener("change",function(e){
  var f=e.target.dataset&&e.target.dataset.f;
  if(f&&e.target.dataset.id){
    var id=+e.target.dataset.id;
    S.term.rows.forEach(function(r){
      if(r.id===id)r[f]=(f==="cap")?(+e.target.value||0):e.target.value;});
    render();
  }
});
document.addEventListener("keydown",function(e){
  if(e.target.dataset&&e.target.dataset.otp!=null&&e.key==="Backspace"&&!e.target.value){
    var inputs=el("otpBox").querySelectorAll("input"), i=+e.target.dataset.otp;
    if(i>0)inputs[i-1].focus();
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&el("ov").classList.contains("on")){closeModal();}
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&S.route==="t/grading"){
    e.preventDefault();
    var b=document.querySelector('[data-act="g-save"]'); if(b)b.click();
  }
});

el("ov").addEventListener("click",function(e){if(e.target===el("ov"))closeModal();});
document.addEventListener("click",function(e){
  if(e.target.closest("#recBtn")){toggleRec();}
});

el("burg").addEventListener("click",function(){
  el("side").classList.add("open"); el("scrim").classList.add("on");});
el("scrim").addEventListener("click",function(){
  el("side").classList.remove("open"); el("scrim").classList.remove("on");});

el("themeBtn").addEventListener("click",function(){
  var root=document.documentElement, cur=root.getAttribute("data-theme");
  if(!cur){cur=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
  root.setAttribute("data-theme",cur==="dark"?"light":"dark");
});

/* ══════════ بالا آمدن ══════════ */
function finishBoot(){
  el("root").classList.toggle("is-live",API.live);
  render();
  var b=el("boot");
  if(b){b.classList.add("off");setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},400);}
}
function startDemo(){API.live=false;finishBoot();}

function boot(){
  /*
   * نیت «ثبت‌نام» را همین اول برمی‌داریم.
   *
   * چند خط پایین‌تر، وقتی معلوم شد کاربر وارد نشده، مسیر به #/auth
   * عوض می‌شود و #/signup از بین می‌رود. اگر منتظر render بمانیم، دیگر
   * چیزی برای خواندن نمانده و دکمهٔ ثبت‌نام سایت کاربر را روی فرم ورود
   * می‌انداخت — همان چیزی که می‌خواستیم از آن فرار کنیم.
   */
  if(/^#\/?signup/.test(location.hash||"")) S.auth.newInst=true;
  if(!window.fetch||!window.Promise){startDemo();return;}
  withTimeout(apiCall("health.php"),4000).then(function(hl){
    if(!hl||!hl.ok||!hl.database){startDemo();return;}
    API.live=true;
    /* "bridge" یعنی کد ورود پیامک نمی‌شود؛ صفحهٔ ورود نباید وعدهٔ پیامک بدهد */
    API.bridge=(hl.sms==="bridge");
    return withTimeout(apiCall("me.php"),4000).then(function(m){
      if(!m||!m.ok||!m.authenticated){
        API.user=null;
        location.hash="#/auth";
        finishBoot();
        return;
      }
      applyUser(m.user);
      // دادهٔ واقعی؛ اگر کاربر عضو هیچ آموزشگاهی نباشد سرور no_institute می‌دهد
      return withTimeout(apiCall("bootstrap.php"),8000).then(function(b){
        if(b&&b.ok){applyBootstrap(b);}
        else if(b&&b.error==="no_institute"){API.noWorkspace=true;}
        else if(b){toast(b.message||"دریافت داده ناموفق بود");}

        var want=API.noWorkspace?"nows":roleRoute(m.user.role);
        var r=location.hash.replace(/^#\/?/,"");
        if(!r||r==="auth"||r==="nows"||r.split("/")[0]!==want){
          location.hash="#/"+want;
        }
        finishBoot();
      });
    });
  },startDemo);
}
boot();
})();
</script>
